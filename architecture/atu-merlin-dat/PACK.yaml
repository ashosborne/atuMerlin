pack_id: atu-merlin-ts-dat-v1
version: 1
status: BOUND
migration_id: atu-merlin
slice_ids:
  - dat-utils

target_stack:
  language: typescript
  runtime: node20
  framework: fastify
  data_access: postgres-sql
  ui: simple-web
  min_versions:
    node: "20"

style: modular-monolith

layout:
  modern_root: modern/
  naming: shared/dat or features/dat
  preferred_paths:
    - modern/src/shared/dat/**
    - modern/src/features/dat/**   # only if a feature surface is required

boundaries:
  in_scope:
    - Date utility module only (dat-utils)
    - Shared date conversion / formatting helpers used across modern callers
  stay_legacy:
    - ATU_SRC
    - CUS (stays under pack atu-merlin-ts-cus-v1; do not re-convert CUS)
    - ORD (stays under pack atu-merlin-ts-ord-v1; do not re-convert ORD)
    - unbound residuals and other non-DAT domains
  anti_corruption: "DAT shared utilities only; align date boundary rules with existing ORD/CUS packs without widening those packs; do not rewrite customer/** or order/**"

api_contract_policy:
  mode: new-http-json
  contract_paths: []
  sourced_vs_inferred: inferred
  notes: "Prefer shared date helpers consumed by existing verticals; HTTP only if Convert needs it. Not preserve-wire against IBM i 5250"

data:
  strategy: postgres-greenfield-from-pf
  schema_changes: additive-only
  migration_tool: null
  notes: "Date lock MUST match ORD: store NULL in Postgres for blank/never; map IBM i 1940-01-01 / zero-date only at the boundary — do NOT invent a different sentinel; modern/db/** and modern/test/** are additive and pack-scoped only — tests only for this pack's surface"

authn_authz:
  mode: pathfinder-open
  notes: "Pathfinder: open/dev auth; not production IAM"

interop:
  modern_to_legacy: none
  legacy_to_modern: none
  notes: "Reuse shared date helpers from ORD/CUS callers; do not rewrite those feature trees or widen their packs"

mapping_rules:
  - from: RPGLE date utilities
    to: TS shared module (modern/src/shared/dat or features/dat)
  - from: "IBM i blank/never date (1940-01-01 / zero-date)"
    to: "store NULL in Postgres; map sentinel only at the boundary (do NOT store 1940-01-01 as a real date; do NOT invent a different sentinel)"
  - from: "99999999 branch (c01)"
    to: "preserve observed behaviour as known_risk until SME names parity"

non_goals:
  - "No CUS or ORD conversion in this pack"
  - "No edits under ATU_SRC/**"
  - "No widening or editing pack atu-merlin-ts-cus-v1 or atu-merlin-ts-ord-v1"
  - "No rewrite of modern/src/features/customer/** or modern/src/features/order/**"
  - "No inventing a different date sentinel than ORD"
  - "No IBM i characterisation goldens / REPLAY_GREEN required for pathfinder"
  - "No microservice split; modular monolith only"
  - "Convert is NOT authorized by Architecture BOUND alone — separate ROOM_OK required"
  - "Do not “fix” planted defects in discovery/architecture"
  - "Do not claim fully migrated"

quality_gates:
  characterization: WAIVED_PATHFINDER
  waiver: "No IBM i goldens; COMPARE at TS API only"
  verification: DEFERRED
  commands: []
  review_skills:
    - migration-correctness

forbidden:
  - "Edit or rewrite ATU_SRC/**"
  - "Widen or overwrite atu-merlin-ts-cus-v1 or atu-merlin-ts-ord-v1"
  - "Edit architecture/atu-merlin/** or architecture/atu-merlin-ord/**"
  - "Rewrite modern/src/features/customer/** or modern/src/features/order/**"
  - "Reshape CUS or ORD schema under modern/db/** — DAT changes additive and pack-scoped only; modern/test/** only for this pack's surface"
  - "Invent a different blank/never date sentinel than ORD (NULL in Postgres; 1940-01-01 / zero-date only at boundary)"
  - "Overwrite BOUND in place; use SUPERSEDE + re-bind for changes"
  - "Convert consuming status DRAFT"
  - "Claim REPLAY_GREEN or invent fake replay_green_run_ids"
  - "Invent SME answers for known_risks below"
  - "String-concat SQL in repositories"
  - "Rewrite discovery cards during Convert"
  - "Claim fully migrated"

edit_surface:
  allow:
    - modern/src/shared/dat/**
    - modern/src/features/dat/**
    - modern/db/**   # additive and pack-scoped only — do not reshape CUS/ORD schema
    - modern/test/**   # pack-scoped only — tests for this pack's surface (dat)
    - modern/src/app.ts   # additive
    - modern/src/server.ts   # additive
    - modern/package.json
    - modern/package-lock.json
    - modern/tsconfig.json
    - modern/vitest.config.ts
    - modern/README.md
    - modern/.gitignore
    - modern/scripts/**
    - architecture/atu-merlin-dat/**
  deny:
    - ATU_SRC/**
    - discovery/**
    - inventory/**
    - overnight/**
    - architecture/atu-merlin/**
    - architecture/atu-merlin-ord/**
    - architecture/atu-merlin-vat/**
    - architecture/atu-merlin-cou/**
    - architecture/atu-merlin-par/**
    - architecture/atu-merlin-log/**
    - modern/src/features/customer/**
    - modern/src/features/order/**
    - modern/openapi/customer.yaml
    - modern/openapi/order.yaml

known_risks:
  - "Pathfinder waiver: no IBM i goldens; COMPARE only at TypeScript API"
  - "Date lock MUST match ORD: store NULL in Postgres for blank/never; map IBM i 1940-01-01 / zero-date only at the boundary — do NOT invent a different sentinel"
  - "Dead ISO_Num_To_Date if QM queries unused (c03)"
  - "99999999 branch (c01)"
  - "Align with existing ORD/CUS date boundary rules without widening those packs"
  - "Architecture DRAFT/BOUND does not authorize Convert; separate ROOM_OK required"
  - "CUS and ORD modern already exist; accidental re-scope of those packs is a fail"

evidence:
  discovery_manifest: inventory/atu-merlin/APP_MANIFEST.yaml
  behaviour_cards:
    - discovery/dat-utils/features/
  replay_green_run_ids: []
  waiver_record: architecture/atu-merlin-dat/ADR/0001-dat-utils-ts-postgres.md

