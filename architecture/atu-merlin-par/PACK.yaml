pack_id: atu-merlin-ts-par-v1
version: 1
status: DRAFT
migration_id: atu-merlin
slice_ids:
  - par-maintain

target_stack:
  language: typescript
  runtime: node20
  framework: fastify
  data_access: postgres-sql
  ui: simple-web
  min_versions:
    node: "20"

style: modular-monolith

layout:
  modern_root: modern/
  naming: shared/parm or features/par
  preferred_paths:
    - modern/src/shared/parm/**
    - modern/src/features/par/**   # only if a maintain surface is required

boundaries:
  in_scope:
    - Parameter / PATH maintain slice only (par-maintain)
    - PARM / FPARM getters and PATH configuration surface as documented
  stay_legacy:
    - ATU_SRC
    - CUS (stays under pack atu-merlin-ts-cus-v1; do not re-convert CUS)
    - ORD (stays under pack atu-merlin-ts-ord-v1; do not re-convert ORD)
    - unbound residuals and other non-PAR domains
  anti_corruption: "PAR maintain / shared parm only; PATH consumers such as ORD500 already converted — document interop as reuse of config; do not rewrite modern/src/features/order/**"

api_contract_policy:
  mode: new-http-json
  contract_paths: []
  sourced_vs_inferred: inferred
  notes: "Prefer shared parm/PATH config module; HTTP maintain UI only if Convert needs it. Not preserve-wire against IBM i 5250"

data:
  strategy: postgres-greenfield-from-pf
  schema_changes: additive-only
  migration_tool: null
  notes: "Map PARM/PATH related PFs additively; PATH may be config vs maintained table (c11) — do not invent disposition; modern/db/** and modern/test/** are additive and pack-scoped only — tests only for this pack's surface"

authn_authz:
  mode: pathfinder-open
  notes: "Pathfinder: open/dev auth; not production IAM"

interop:
  modern_to_legacy: none
  legacy_to_modern: none
  notes: "ORD500 already converted and consumes PATH — document interop as reuse of config; do not rewrite the order feature or widen atu-merlin-ts-ord-v1"

mapping_rules:
  - from: RPGLE FPARM / PAR maintain programs
    to: TS shared module and/or features/par
  - from: PF PARM / PATH
    to: postgres table or config surface (choose at convert; document choice; c11 open)
  - from: DSPF
    to: web (if Convert includes maintain UI)

non_goals:
  - "No rewrite of order feature for PATH consumers (ORD500 already converted)"
  - "No widening pack atu-merlin-ts-ord-v1 or atu-merlin-ts-cus-v1"
  - "No CUS or ORD conversion in this pack"
  - "No edits under ATU_SRC/**"
  - "No rewrite of modern/src/features/customer/** or modern/src/features/order/**"
  - "No IBM i characterisation goldens / REPLAY_GREEN required for pathfinder"
  - "No microservice split; modular monolith only"
  - "Convert is NOT authorized by Architecture BOUND alone — separate ROOM_OK required"
  - "Do not claim fully migrated"

quality_gates:
  characterization: WAIVED_PATHFINDER
  waiver: "No IBM i goldens; COMPARE at TS API only"
  verification: DEFERRED
  commands: []
  review_skills:
    - migration-correctness

forbidden:
  - "Edit or rewrite ATU_SRC/**"
  - "Widen or overwrite atu-merlin-ts-cus-v1 or atu-merlin-ts-ord-v1"
  - "Edit architecture/atu-merlin/** or architecture/atu-merlin-ord/**"
  - "Rewrite modern/src/features/customer/** or modern/src/features/order/**"
  - "Reshape CUS or ORD schema under modern/db/** — PAR tables additive and pack-scoped only; modern/test/** only for this pack's surface"
  - "Rewrite ORD500 / order feature to re-home PATH — document config reuse instead"
  - "Overwrite BOUND in place; use SUPERSEDE + re-bind for changes"
  - "Convert consuming status DRAFT"
  - "Claim REPLAY_GREEN or invent fake replay_green_run_ids"
  - "Invent SME answers for known_risks below"
  - "String-concat SQL in repositories"
  - "Rewrite discovery cards during Convert"
  - "Claim fully migrated"

edit_surface:
  allow:
    - modern/src/shared/parm/**
    - modern/src/features/par/**
    - modern/db/**   # additive and pack-scoped only — do not reshape CUS/ORD schema
    - modern/test/**   # pack-scoped only — tests for this pack's surface (par)
    - modern/src/app.ts   # additive
    - modern/src/server.ts   # additive
    - modern/package.json
    - modern/package-lock.json
    - modern/tsconfig.json
    - modern/vitest.config.ts
    - modern/README.md
    - modern/.gitignore
    - modern/scripts/**
    - architecture/atu-merlin-par/**
  deny:
    - ATU_SRC/**
    - discovery/**
    - inventory/**
    - overnight/**
    - architecture/atu-merlin/**
    - architecture/atu-merlin-ord/**
    - architecture/atu-merlin-vat/**
    - architecture/atu-merlin-dat/**
    - architecture/atu-merlin-cou/**
    - architecture/atu-merlin-log/**
    - modern/src/features/customer/**
    - modern/src/features/order/**
    - modern/openapi/customer.yaml
    - modern/openapi/order.yaml

known_risks:
  - "Pathfinder waiver: no IBM i goldens; COMPARE only at TypeScript API"
  - "PATH as config vs maintained table (c11) — do not invent disposition"
  - "PATH trailing slash / filesystem semantics (c07)"
  - "Unused GetPARM getters — do not invent consumers"
  - "PATH consumers ORD500 already converted — do not rewrite order feature; document interop as reuse of config"
  - "Architecture DRAFT/BOUND does not authorize Convert; separate ROOM_OK required"
  - "CUS and ORD modern already exist; accidental re-scope of those packs is a fail"
  - "modern/db/** additive only — do not reshape CUS or ORD schema"

evidence:
  discovery_manifest: inventory/atu-merlin/APP_MANIFEST.yaml
  behaviour_cards:
    - discovery/par-maintain/features/
  replay_green_run_ids: []
  waiver_record: architecture/atu-merlin-par/ADR/0001-par-maintain-ts-postgres.md

bound_by: null
bound_at: null
change_policy: "DRAFT does not authorize Convert. Convert requires human-bound pack (status: BOUND) plus separate ROOM_OK. To change architecture after BOUND, bump version, SUPERSEDE prior pack, and re-bind — do not overwrite in place."
reference_skeleton: null