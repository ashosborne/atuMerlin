needs_sme:
  - "c12 (inferred): deleting the latest order leaves CUSTOMER.CULASTORD pointing at it until ART801 recomputes (mechanism documented as ord-trigger-ord700-c08). Confirm on the box; accepted drift or not? No card."
  - "c09: option 2 is unreachable in ORD200 (precedence defect, ORD200.PGM.SQLRPGLE:187); ORD201 has the parentheses. Preserve as-is in the target or adopt the ORD201 rule? Room decision; planted defect stays as-is for now."
  - "c06/c07: close (7) stamps ORDATDEL when blank but leaves every ODQTYLIV at 0; deliver (8) sets undelivered lines to fully delivered, skips partial lines, does not close. Intended distinction? Header 'delivered' with outstanding partial lines is an accepted state?"
  - "c06/c07/c08: 'already closed' (7) and 'already delivered' (8) are refused with the generic 'Invalid Option' text; only 2/4 get the closed-order wording. Accepted wording?"
  - "c04/c13: no confirmation before delete; header deleted before lines (ORD201: lines first); an unmonitored failure between the two leaves orphan lines with no header (ORD201: header with missing lines). The deleted row stays on screen with its data (ORD201 blanks it) and 7/8 on that ghost row chain-miss then update -> unmonitored exception. Which twin is the parity reference?"
  - "c01: whole result loaded in one pass (no PAGEDOWN; ORD201 pages 14 at a time); ORDER BY datord only, no orid tie-breaker (ORD201 adds orid desc); F5 is enabled (CA05) but unlabelled and unhandled - redisplay without reload. Follow ORD201 in the target or keep?"
  - "c01: any non-zero SQLCOD (including -305 from ISOTODATE40 returning NULL on an invalid date) ends the load silently at that row. Known?"
  - "c08: option 3 is invalid in ORD200 but passes validation in ORD201 (silently stays typed). One rule for the target?"
  - "c08: one refused row cancels every option on the pass (valid rows stay typed). Keep or execute the valid rows?"
  - "c06/c07: guards read the subfile copies of datclo/datliv; state changed by another job after the load is not seen (chain then overwrites). Accepted?"
  - "c10: activation group inferred QILE (no ACTGRP keyword) - build owner to confirm CRTSQLRPGI options; c02: OVRDBF scope in ORD100C is a build property (ord-entry-ord100 owns)."
  - "c10/c11: ORD201D reuses the panel id literal 'ORD200-1'; ORD200 takes CUSTNM from a native chain while ORD201 selects it from the view. Cosmetic; recorded."

features:
  - id: ord-maintain-ord200-c01
    name: List customer's orders from ORDERCUS view
    status: documented
    confidence: observed-in-code
    summary: "SQL cursor over ORDERCUS WHERE orcuid = :cuid, ISOTODATE40 on ORDATE/ORDATDEL/ORDATCLO, TOTVAL (VAT-inclusive sum of ODTOTVAT), ORDER BY datord DESC with no tie-breaker; every row loaded in one pass (dow sqlcod = 0), cursor closed, sflend on. SFLSIZ 15 / SFLPAG 14 auto-extend, no PAGEDOWN keyword or branch. Any non-zero SQLCOD (incl. -305 on a NULL date) ends the load silently. F5 enabled (CA05) but unlabelled and unhandled -> redisplay, no reload. Reload only at start and after F6. Dead declarations rrs01/count/mode/User/savId/refresh/pagedown."
    entrypoints:
      - kind: screen
        locator: ORD200 CTL01/SFL01 (s01prp / s01lod / s01dsp)
        evidence: ["ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:100-144", "ATU_SRC/QSQLSRC/ORDERCUS.VIEW:5-21", "ATU_SRC/QDDSSRC/ORD200D.DSPF:12-45"]
    behaviour_doc: features/ord-maintain-ord200-c01.md
    dependencies: [ORDERCUS.VIEW, ISOTODATE4.SQLUDF, DAT002.PGM.RPGLE]
    open_questions: ["needs-SME: no orid tie-breaker, whole-result load, unhandled F5 - follow ORD201 or keep as-is?", "needs-SME: silent truncation on any SQL condition - known?"]
  - id: ord-maintain-ord200-c02
    name: F6 create order for customer -> ORD100C
    status: documented
    confidence: observed-in-code
    summary: "F6 (CF06) calls ORD100C(cuid) - CL that stages QTEMP/DETORD without constraints/triggers and runs CRTORD CUID(&CUID) - then step01 = prp reloads the whole list unconditionally (also after a cancelled create). Typed options on the F6 pass are discarded (s01key handles create before chk). cuid never modified. ORD201 calls the parameterless ORD100C2 instead."
    entrypoints:
      - kind: other
        locator: ORD200 F6 -> extpgm ORD100C
        evidence: ["ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:30-31", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:154-156", "ATU_SRC/QCLSRC/ORD100C.PGM.CLLE:4-12"]
    behaviour_doc: features/ord-maintain-ord200-c02.md
    dependencies: [ORD100C.PGM.CLLE, CRTORD.CMD]
    open_questions: []
  - id: ord-maintain-ord200-c03
    name: Option 2 update lines -> ORD101 (unreachable as coded)
    status: documented
    confidence: observed-in-code
    summary: "s01act would call ORD101(orid) by reference, clear the option and rewrite the row without reload. Never executed: s01chk refuses every 2 with SFLMSG 36 (c09) and any refused row cancels the pass, so lines 225-228 are dead code under a live '2=Edit' legend. Line maintenance per customer is therefore impossible; only ORD201 reaches ORD101. Planted defect, as-is."
    entrypoints:
      - kind: other
        locator: ORD200 opt 2 -> extpgm ORD101
        evidence: ["ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:21-22", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:225-228", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:187-195"]
    behaviour_doc: features/ord-maintain-ord200-c03.md
    dependencies: [ORD101.PGM.RPGLE]
    open_questions: ["needs-SME / room: preserve 'option 2 never works in ORD200' or adopt the ORD201 rule (see c09)?"]
  - id: ord-maintain-ord200-c04
    name: Option 4 delete order and lines
    status: documented
    confidence: observed-in-code
    summary: "After the c08 guards (not closed by screen datclo; no DETORD line with ODQTYLIV > 0 by file read): delete orid order1 (keyed, no chain, not-found untested), then dou not %found / delete orid detord1 by partial key until none; opt01 = 0; update sfl01. No confirmation, no commitment control. The deleted row stays on screen with its data (ORD201 zeroes orid/oryear): re-selecting it, 4 is a silent no-op, 5/6 call the callee with a missing order, 7/8 chain-miss then update forde -> unmonitored exception. Each line delete fires ORD700 delete (full ODQTY subtracted since ODQTYLIV = 0). No ORDER delete trigger -> CULASTORD not maintained (c12)."
    entrypoints:
      - kind: screen
        locator: ORD200 opt 4 (s01chk guard + s01act)
        evidence: ["ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:187-212", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:229-235", "ATU_SRC/QDDSSRC/ORD200D.DSPF:43-44"]
    behaviour_doc: features/ord-maintain-ord200-c04.md
    dependencies: [ORDER1.LF, DETORD1.LF, ORD700D.SYSTRG]
    open_questions: ["needs-SME: no confirmation prompt before delete - carry forward?", "needs-SME: ghost row after delete and the 7/8-on-ghost exception - known? ORD200 or ORD201 screen behaviour as parity reference?"]
