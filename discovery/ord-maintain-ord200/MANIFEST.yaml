        locator: ORD200 opt 5/6 -> extpgm ORD202 / ORD500
        evidence: ["ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:24-28", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:236-243", "ATU_SRC/QDDSSRC/ORD200D.DSPF:61-65"]
    behaviour_doc: features/ord-maintain-ord200-c05.md
