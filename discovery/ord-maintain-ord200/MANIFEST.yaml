  - id: ord-maintain-ord200-c06
    name: Option 7 close order
    status: documented
    confidence: observed-in-code
    summary: "Guard: screen datclo > 1940-01-01 -> refused with SFLMSG 35 'Invalid Option' (not the closed-order text). Action: chain (orid) order1 (%found untested); if ordatdel = 0 then ordatdel = today; ordatclo = today; update forde; datclo (and datliv) = %date() on the row; no reload. Lines untouched: closing an undelivered order stamps a delivery date while every ODQTYLIV stays 0, so the ORD700-maintained ARCUSQTY is not reduced by a close while ART801 (ORDATCLO = 0 filter) drops the order. After 7 the row refuses 7, 8, 4 and 2. Chain miss on a ghost row -> update without lock -> unmonitored exception. Identical in ORD201."
    entrypoints:
      - kind: screen
        locator: ORD200 opt 7 (s01chk guard + s01act)
        evidence: ["ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:177-186", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:244-254", "ATU_SRC/QDDSSRC/ORD200D.DSPF:40"]
    behaviour_doc: features/ord-maintain-ord200-c06.md
    dependencies: [ORDER1.LF]
    open_questions: ["needs-SME: close implies delivery date but not delivered quantities - intended distinction from 8?", "needs-SME: 'Invalid Option' wording for already-closed - accepted?"]
  - id: ord-maintain-ord200-c07
    name: Option 8 deliver order
    status: documented
    confidence: observed-in-code
    summary: "Guard: screen datliv > 1940-01-01 -> refused with 'Invalid Option'. Action: chain order1 (%found untested); ordatdel = today; update forde; then setll/reade DETORD1 with lock: ODQTYLIV = 0 -> ODQTYLIV = ODQTY, update fdeto (ORD700U delta = -ODQTY); else unlock. Partial lines frozen; zero-qty lines rewritten with a zero delta; order not closed (ART801 still counts it). 7 always sets ORDATDEL, so deliver-after-close is impossible. No reload; SUMORD unchanged. Chain miss on a ghost row -> unmonitored exception. Identical in ORD201."
    entrypoints:
      - kind: screen
        locator: ORD200 opt 8 (s01chk guard + s01act)
        evidence: ["ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:177-186", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:255-272", "ATU_SRC/QRPGLESRC/ORD700.PGM.RPGLE:83-93"]
    behaviour_doc: features/ord-maintain-ord200-c07.md
    dependencies: [ORDER1.LF, DETORD1.LF, ORD700U.SYSTRG]
    open_questions: ["needs-SME: all-or-nothing per undelivered line, partial lines skipped, order left open - intended rule? Partial delivery at order level in the target?"]
  - id: ord-maintain-ord200-c08
    name: Option guards
    status: documented
    confidence: observed-in-code
    summary: "s01chk per changed row: 1/3/>8 invalid (35); 7 if datclo set or 8 if datliv set (35 'Invalid Option' - generic text for state refusals); 2 always or 4 if closed (36, c09); 4 with any line ODQTYLIV > 0 by live file read (37, DDS typo 'whith'). Failure: DSPATR(RI), first-error page positioning, step01 = dsp - one bad row cancels every action on the pass and valid options stay typed. Tests are not exclusive (36 + 37 can co-fire). State guards read subfile copies of datclo/datliv. Option 3 is invalid here but passes in ORD201 (stays typed silently). Message indicators cleared by the display (response indicators)."
    entrypoints:
      - kind: screen
        locator: ORD200 s01chk
        evidence: ["ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:162-218", "ATU_SRC/QDDSSRC/ORD200D.DSPF:40-44", "ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:172"]
    behaviour_doc: features/ord-maintain-ord200-c08.md
    dependencies: [DETORD1.LF]
    open_questions: ["needs-SME: 'Invalid Option' for already closed / delivered - surface the reason in the target?", "needs-SME: one refused row cancels the whole pass - keep?", "needs-SME: option 3 divergence with ORD201 - one rule?"]
