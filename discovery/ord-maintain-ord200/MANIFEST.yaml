  - id: ord-maintain-ord200-c13
    name: Delete ordering differs from ORD201
    status: documented
    confidence: observed-in-code
    summary: "ORD200: delete orid order1 then dou/delete orid detord1, row left as loaded. ORD201: lines first, then header, then orid = 0 / oryear = 0 so the row shows blank. Same guards, triggers, no confirmation, no commitment control. Failure residue differs: ORD200 -> orphan lines with no header (invisible to ORDERCUS/ART801, still counted in ORD700-maintained ARCUSQTY, unreachable from any screen); ORD201 -> header with missing lines. ORD200 contends for the header lock first (held by any open ORD101 session), so it fails before touching lines. ORD201's blanking is cosmetic, not a guard (7/8 on the blank row chain-miss on key 0)."
    entrypoints:
      - kind: other
        locator: ORD200 vs ORD201 opt 4
        evidence: ["ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:229-235", "ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:233-241"]
    behaviour_doc: features/ord-maintain-ord200-c13.md
    dependencies: [ORDER1.LF, DETORD1.LF]
    open_questions: ["needs-SME / room: which twin's delete (order of statements, screen residue) is the parity reference? One transactional path in the target removes both residues."]
