    status: documented
    confidence: observed-in-code
    summary: "5 -> ORD202(orid), 6 -> ORD500(orid), synchronous, orid by reference; option cleared, row rewritten, no reload. No state guard: closed, delivered and ghost (deleted, c04) orders can be displayed or printed - the callee's not-found handling applies. Legend '6=Print  ' has two trailing blanks (ORD201D: '6=Print')."
    entrypoints:
