features:
  - id: dat-utils-c01
    name: ISOTODATE40 sentinel conversion (0 -> 1940-01-01, 99999999 -> 2039-12-31, invalid -> NULL)
    status: documented
    confidence: observed-in-code
    summary: "DAT002: date_ind = 0, SQL_State = '00000'; if dat8 = 0 -> D'1940-01-01'; elseif dat8 = *Hival (99999999 for 8 0) -> D'2039-12-31'; else test(de) *iso dat8 -> %date(dat8:*iso) or date_ind = -1 (NULL, date untouched). NULL in never reaches the program (RETURNS NULL ON NULL INPUT). No range check; years 0001-9999 accepted. Derived: 1940-01-01 / 2039-12-31 are *LOVAL / *HIVAL of RPG 2-digit-year date formats. In-tree writers produce only 0 or a valid date, so the 2039 branch is unreachable from in-tree data and has no MAPVAL (would display and count as 'closed'). Callers fetch the result with no null indicator, so a NULL (invalid stored date) ends the ORD200/ORD201 list load silently (SQLCODE -305) - pointer to the caller slices, reachable only via out-of-tree writes."
    entrypoints:
      - kind: api
        locator: SQL ISOTODATE40 -> DAT002
        evidence: ["ATU_SRC/QRPGLESRC/DAT002.PGM.RPGLE:40-57", "ATU_SRC/QSQLSRC/ISOTODATE4.SQLUDF:4-14", "ATU_SRC/QDDSSRC/ORD200D.DSPF:23-27", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:121-131"]
    behaviour_doc: features/dat-utils-c01.md
    dependencies: [ORDER.PF, ORDERCUS.VIEW]
    open_questions: ["needs-SME: is 1940-01-01 the target's 'no date' sentinel, or NULL?", "needs-SME: is the 99999999 -> 2039-12-31 branch used by any out-of-tree data?"]
  - id: dat-utils-c02
    name: ISO_Num_To_Date plain conversion (0 -> NULL)
    status: documented
    confidence: observed-in-code
    summary: "DAT001 is DAT002 without the if dat8 = 0 / elseif *Hival block: every argument goes to test(de) *iso, so 0 (month 00) and 99999999 (month 99) return NULL. Bodies otherwise line-for-line identical (status DS, 8-parameter interface, *PSSR, return without *inlr). SPECIFIC ISOTODATE; ARCAD header author VTAQUIN 29/11/2016. No caller in ATU_SRC (c03); only possible consumers are the QM queries with no source. Phase A recommended defer; room accepted for documentation."
    entrypoints:
      - kind: api
        locator: SQL ISO_Num_To_Date (SPECIFIC ISOTODATE) -> DAT001
        evidence: ["ATU_SRC/QRPGLESRC/DAT001.PGM.RPGLE:40-51", "ATU_SRC/QSQLSRC/ISOTODATE.SQLUDF:20-30", "ATU_SRC/QPNLSRC/SAMMNU.MENU:126-132"]
    behaviour_doc: features/dat-utils-c02.md
    dependencies: []
