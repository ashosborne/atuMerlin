  - id: dat-utils-c05
    name: Error path SQLSTATE 38I02 with exception text
    status: documented
    confidence: observed-in-code
    summary: "*PSSR in both programs: SQL_State = '38I02', Msg_Text = %trimr(stExcText) (SDS positions 91-170, 80 chars, truncated to the 70-char VARYING parameter), return. date_ind stays 0 and date untouched - DB2 discards the call because the SQLSTATE is an error class (SQL0443). An invalid date is NOT an error (test(de) -> NULL); *PSSR is reached only by unmonitored exceptions - derived: effectively only a decimal-data error on a corrupt packed argument. Same SQLSTATE for every exception; exception id / program name not inspected. In ORD200/ORD201 an error surfaces only as a non-zero sqlcod that ends the list load silently."
    entrypoints:
      - kind: other
        locator: DAT001 / DAT002 *PSSR
        evidence: ["ATU_SRC/QRPGLESRC/DAT001.PGM.RPGLE:53-60", "ATU_SRC/QRPGLESRC/DAT002.PGM.RPGLE:59-66", "ATU_SRC/QRPGLESRC/DAT001.PGM.RPGLE:7-11"]
    behaviour_doc: features/dat-utils-c05.md
    dependencies: []
    open_questions: []
  - id: dat-utils-c06
    name: Programs stay active between rows (return without *inlr); no state kept
    status: documented
    confidence: observed-in-code
    summary: "Every exit (normal and *PSSR) is return with *inlr off; no H spec, no F spec, no program globals besides the status DS. date_ind and SQL_State are reset at the top of every call; the result parameter date is DB2's storage, not the program's (c08). Contrast the FVAT / FCUSTOMER getters where the same shape keeps a last-key buffer - here there is nothing to go stale. DETERMINISTIC is truthful. Activation group / FENCED status are compile- and create-time options not in source."
    entrypoints:
      - kind: other
        locator: DAT001 / DAT002 return
        evidence: ["ATU_SRC/QRPGLESRC/DAT001.PGM.RPGLE:51", "ATU_SRC/QRPGLESRC/DAT002.PGM.RPGLE:57", "ATU_SRC/QRPGLESRC/DAT001.PGM.RPGLE:42-43", "ATU_SRC/QRPGLESRC/DAT002.PGM.RPGLE:42-43"]
    behaviour_doc: features/dat-utils-c06.md
    dependencies: []
    open_questions: []
  - id: dat-utils-c07
    name: 0 -> 1940-01-01 sentinel implemented three times across the estate
    status: documented
    confidence: observed-in-code
    summary: "Storage convention: 0 = no date (ORDER.ORDATDEL / ORDATCLO, CUSTOMER.CULASTORD); presentation: 0 -> 1940-01-01 -> DDS MAPVAL blank. The 0 -> 1940 step exists in DAT002 (SQL), CUS200 (explicit if CULASTORD = 0, cus-interactive-c07) and ORD202 (implicit: *inzsr presets d'1940-01-01' and the field is simply not assigned when the numeric is 0 - correction to Phase A wording for ord-maintain-ord202-c01, works because ORD202 ends with *inlr per order). Only DAT002 also maps 99999999 -> 2039-12-31; the RPG paths would raise an unmonitored date error on it. ORD200/ORD201 hold the same constant to COMPARE the UDF output (datclo > datBlank = already closed) - SQL sentinel and RPG constant must agree. The raw 0 is tested directly by ORD200/ORD201 (if ordatdel = 0), ORD202 / ORD901 (> 0) and ART801 (ORDATCLO = 0 = open). Each member declares its own d'1940-01-01'; no shared definition. ORD202 / ORD500 convert ORDATE with no guard (never 0 in-tree). Derived: the two values are *LOVAL / *HIVAL of RPG 2-digit-year date formats (ORD202D shows the sentinel as 01/01/40 under *DMY)."
    entrypoints:
      - kind: other
        locator: DAT002 vs CUS200 / ORD202 (+ ORD200 / ORD201 comparisons)
        evidence: ["ATU_SRC/QRPGLESRC/DAT002.PGM.RPGLE:45-48", "ATU_SRC/QRPGLESRC/CUS200.PGM.SQLRPGLE:89", "ATU_SRC/QRPGLESRC/CUS200.PGM.SQLRPGLE:260-264", "ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:58", "ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:83-91", "ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:147-151", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:177-187", "ATU_SRC/QDDSSRC/ORD200D.DSPF:24-27", "ATU_SRC/QDDSSRC/ORD202D.DSPF:57-60", "ATU_SRC/QSQLSRC/ART801.SQLPRC:25-33"]
    behaviour_doc: features/dat-utils-c07.md
    dependencies: [cus-interactive-c07, ord-maintain-ord202-c01, ord-maintain-ord200, ord-maintain-ord201]
    open_questions: ["needs-SME / room: collapse into one rule in the target (and which: 1940-01-01 sentinel or NULL)?"]
  - id: dat-utils-c08
    name: Result value unassigned on invalid input (port trap)
    status: documented
    confidence: observed-in-code
    summary: "On test(de) failure only date_ind = -1 is set; the date result parameter (DB2's buffer, by reference) is not written and the program never initialises it. Correct and invisible under SQL semantics; a port returning 'date + flag' or reading the value before the flag would surface an undefined value. On the *PSSR path neither date nor date_ind is set (date_ind stays 0) - DB2 discards the call via the SQLSTATE. Sentinel and valid paths always assign date and leave date_ind = 0. In the callers the un-indicated fetch fails, so the host variable is not updated and the row is never written."
    entrypoints:
      - kind: other
        locator: DAT001 / DAT002 %error branch
        evidence: ["ATU_SRC/QRPGLESRC/DAT001.PGM.RPGLE:45-50", "ATU_SRC/QRPGLESRC/DAT002.PGM.RPGLE:50-55", "ATU_SRC/QRPGLESRC/DAT001.PGM.RPGLE:33"]
    behaviour_doc: features/dat-utils-c08.md
    dependencies: []
    open_questions: []
