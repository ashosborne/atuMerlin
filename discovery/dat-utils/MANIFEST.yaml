  - "c01/c07: is 1940-01-01 the agreed 'no date' sentinel for the target, or should the target store/return NULL (or an optional type) and let the UI decide how to show 'none'? As-is: 0 stored, 1940-01-01 produced in three places, blanked by DDS MAPVAL, and compared as a constant in ORD200/ORD201."
