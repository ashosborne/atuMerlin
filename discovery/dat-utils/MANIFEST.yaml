  - id: dat-utils-c03
    name: Callers - ISOTODATE40 from ORD200/ORD201 cursors; ISO_Num_To_Date unused
    status: documented
    confidence: observed-in-code
    summary: "Exactly two call sites, both embedded-SQL cursors over ORDERCUS: ORD200 (WHERE orcuid = :cuid, loads all rows, order by datord desc) and ORD201 (all orders, 14 per page, order by datord desc, orid desc). Each wraps ORDATE / ORDATDEL / ORDATCLO as DATORD / DATLIV / DATCLO and fetches into the display-file L fields (DATFMT(*JOB)) with no null indicators and only a sqlcod = 0 check. After deliver/close the callers refresh the subfile dates with %date() directly (UDF not re-invoked until the list is rebuilt); *inzsr presets the three fields to d'1940-01-01'. ISO_Num_To_Date has no occurrence outside its CREATE FUNCTION. Other programs showing the same columns (ORD202, ORD500, CUS200, ORD901) convert in RPG with %date(x:*iso) instead - two conversion paths for one storage format (c07)."
    entrypoints:
      - kind: other
        locator: grep ISOTODATE40
        evidence: ["ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:105-113", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:121-131", "ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:98-106", "ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:117-125", "ATU_SRC/QSQLSRC/ISOTODATE.SQLUDF:20"]
    behaviour_doc: features/dat-utils-c03.md
    dependencies: [ORDERCUS.VIEW]
    open_questions: ["needs-SME: do the QM queries CUSQRY / ARTQRY (not in tree) use ISO_Num_To_Date or ISOTODATE40?"]
  - id: dat-utils-c04
    name: UDF interface contract (PARAMETER STYLE SQL, DETERMINISTIC, NO SQL) - 8 parameters
    status: documented
    confidence: observed-in-code
    summary: "Both functions: LANGUAGE RPGLE, DETERMINISTIC, NO SQL, RETURNS NULL ON NULL INPUT, NO EXTERNAL ACTION, PARAMETER STYLE SQL, EXTERNAL NAME DAT00n unqualified (resolved via the library list), SPECIFIC = member name (ISOTODATE / ISOTODATE4). PARAMETER STYLE SQL with one argument gives an 8-parameter list (argument, result, argument null ind, result null ind, SQLSTATE 5, function name 139, specific name 128, message text 70 varying) - correction to Phase A '9-parameter'; scratchpad / call type / dbinfo absent (no SCRATCHPAD / FINAL CALL / DBINFO). Declared twice per member (pr extpgm + pi), no shared copybook. dat8_ind, Function_Name, Specific_Name and stPgmName never read. FENCED, ALLOW PARALLEL, PROGRAM TYPE (default MAIN) not specified. No build script creates the functions (creation order / library are build metadata)."
