        locator: SAMMNU opt 84
        evidence: ["ATU_SRC/QPNLSRC/SAMMNU.MENU:159-162", "ATU_SRC/QRPGLESRC/LOG300.RPGLE:4", "ATU_SRC/QRPGLESRC/LOG300.RPGLE:41"]
    behaviour_doc: features/log-programs-c09.md
