  - id: log-programs-c09
    name: Log reader - menu option 84 runs ADSPUSRSPC (not in tree); no in-tree reader of SAMLOG
    status: documented
    confidence: inferred
    summary: "SAMMNU option 84 'Display Application log' = cmd adspusrspc samlog (unqualified, *LIBL, help=nohelp). ADSPUSRSPC has no source in ATU_SRC (grep = the menu line only; QCMDSRC has no member) - probably an ARCAD utility (inference); what it renders is unknown. No other reader: SAMLOG is referenced only by LOG100, LOG300 and the menu. The log is write-only from the application's point of view. A reader written from these cards would decode offset 0 as bytes used, take bytes 7..pos-1 and split on ' ***' (c02, c03). A stopped (c04) or never-started (c06) log is indistinguishable from 'nothing happened'. menu-cmd-shell lists option 84 among the options reaching absent objects (with 12/13)."
