  - id: log-programs-c05
    name: LOG100 QUSCRTUS errors swallowed; QUSPTRUS (no error code) surfaces them one line later - or silently resets an old log
    status: documented
    confidence: observed-in-code
    summary: "errcod DS passed to QUSCRTUS with bytes-provided = 256 -> failures returned in the DS, never inspected. The next call, QUSPTRUS, is prototyped without an error code: create failed + no SAMLOG -> escape (CPF9801, inference) unmonitored in LOG100 -> RNQ0202 inquiry; create failed + an OLD SAMLOG present -> QUSPTRUS succeeds on the old object and lines 24-25 reset its header (pos = 7, '***') - the old log is logically emptied although create failed (inference). Phase A 'errors swallowed' sharpened: swallowed at the API, reported indirectly by the next one, fully silent only in the old-object case. Mirror image in LOG300: the same QUSPTRUS prototype escapes into ORD700's callp(e) (c06)."
    entrypoints:
