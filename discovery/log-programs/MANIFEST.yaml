        locator: LOG100 crtusrspc / rtvusrspcptr calls
        evidence: ["ATU_SRC/QRPGLESRC/LOG100.PGM.RPGLE:21-25", "ATU_SRC/QPROTOSRC/APICALL.RPGLEINC:4-16", "ATU_SRC/QPROTOSRC/APICALL.RPGLEINC:25-33"]
    behaviour_doc: features/log-programs-c05.md
