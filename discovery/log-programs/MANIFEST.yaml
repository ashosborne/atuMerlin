        locator: LOG300 data / pos
        evidence: ["ATU_SRC/QRPGLESRC/LOG300.RPGLE:13", "ATU_SRC/QRPGLESRC/LOG300.RPGLE:27-32", "ATU_SRC/QRPGLESRC/LOG100.PGM.RPGLE:21", "ATU_SRC/QRPGLESRC/ORD700.PGM.RPGLE:78", "ATU_SRC/QDDSSRC/SAMREF.PF:11,34,37,47"]
    behaviour_doc: features/log-programs-c04.md
    dependencies: [c01, c02, c03, c07]
