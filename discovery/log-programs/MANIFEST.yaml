needs_sme:
  - "room (whole slice): is the SAMLOG user-space log behaviour to preserve at all? Recommendation unchanged from Phase A - non-functional side effect; the ORD vertical already writes the same Msg text plus a 10-char user and a timestamp to a samlog table on every line delete (modern/db/schema.sql:132-140,187-199; verification/ord-vertical PARITY c03 as_is). Nothing in c01/c02/c04/c05/c06/c08/c09/c10 has a target counterpart; c03's line string (User:/Date:/Msg: prefixes, ' ***' terminator) is the only thing a reader could depend on. Never widen atu-merlin-ts-ord-v1 from this slice."
  - "c04 (inferred, carded): capacity. 5000-byte initial size, no auto-extend (QUSCUSAT never called), 600-byte fixed write per call -> first failure when pos + 600 > allocated size, i.e. from pos ~4400 if the allocation is exactly 5000 = ~35 ORD700 lines of ~125 bytes (Phase A said 40-60); page-rounded allocation would move it to ~7600 / ~60 lines. The failing assignment leaves pos unchanged, so every later call in every job fails at the same offset - permanent and silent (callp(e), %error unread). Box: actual allocated size (DSPOBJD *FULL / QUSRUSAT); has it ever filled; what did operators see?"
  - "c06 (inferred, carded): LOG100 has no caller / menu entry / CL / .ILEPGM - install step run by hand. If never run (or SAMLOG not on the writer's *LIBL), init sets inz=*on BEFORE the failing QUSPTRUS, so the failure is never retried in the activation group: every AddLogEntry in the job fails (null p1 -> MCH3601, inference), all swallowed by ORD700. Ops: who runs LOG100, when, in which library list; is it in an ARCAD deployment script outside the tree?"
  - "c08 (build owner / ARCAD): LOG not in SAMPLE.BNDDIR, ORD700 has no bnddir and no .ILEPGM - how AddLogEntry is bound into ORD700 is outside the tree (same line as ord-trigger-ord700-c03 and srvpgm-supporting). EXPORT(*ALL) exports exactly one procedure (only AddLogEntry carries export on its P-spec; init does not) - no .BND, generated signature, no *PRV."
  - "c09 (inferred, carded): ADSPUSRSPC (menu opt 84) has no source in the tree; what it renders is unknown; no other reader of SAMLOG exists. Ops: which product supplies it; does anyone use option 84; is SAMLOG content ever needed after the fact (audit / support)?"
  - "c10 (inferred, carded): read pos / write 600 bytes / pos += len with no lock - two jobs deleting lines at the same instant overwrite one another's line (lost line, blank run, cursor over-advanced). Rare in-tree (one delete per Enter); realistic for a two-job cleanup. Acceptable loss for a diagnostic log? Target insert is transactional - no counterpart."
  - "c03 (target semantics): User is a module static inz(*USER) stamped when the LOG service program is activated in the caller's activation group (ACTGRP(*CALLER); ORD700 dftactgrp(*no) -> QILE, inference) - a profile-swapping job would log the first user for every later line. Also: 500-varying build buffer truncates a trimmed message > 437 chars and drops the ' ***' terminator (not reachable from ORD700); %trim strips leading blanks; User written blank-padded to 10. Target already records the actor per event (ord700_user()); confirm that is the intended contract."
  - "c05 (Phase A sharpened): only the QUSCRTUS error is swallowed (errcod DS never inspected). QUSPTRUS is prototyped without an error code, so a create failure with no existing SAMLOG surfaces one line later as an unmonitored escape (CPF9801 -> RNQ0202 inquiry, inference); a create failure with an OLD SAMLOG present succeeds silently on the old object and resets its header (pos=7, '***') - the old log is logically emptied. Runtime-confirmable."
  - "c01 / c02 (format facts): replace *YES means re-running LOG100 resets the log; a job that already resolved p1 keeps writing to the replaced copy (inference). Header = 4-byte big-endian pos at offset 0 + '***' at 4, entries from 7, no separator but ' ***', layout defined twice (LOG100 DS, LOG300 standalone based fields) with no shared copybook. Migration of existing SAMLOG content wanted? (Recommendation: no.)"

features:
  - id: log-programs-c01
    name: LOG100 creates the SAMLOG user space (5000 bytes, replace *YES) in PARAMETER's library
    status: documented
    confidence: observed-in-code
    summary: "LOG100 (27 lines, dftactgrp(*no), no parameters, no screen, no message) opens PARAMETER only to take the opened file's library from INFDS 93-102 (par-maintain-c13), builds 'SAMLOG    ' + Lib and calls QUSCRTUS: attribute LOG, initial size 5000, X'00', *ALL, text 'Sample Application Log', replace *YES; then QUSPTRUS and the 7-byte header (pos = 7, '***'). No auto-extend (QUSCUSAT never called anywhere) - the size is a hard capacity (c04). Re-running LOG100 replaces the space: the log is reset, and a job that already holds p1 keeps writing to the replaced copy (inference). Created beside PARAMETER (INFDS at install), found later via *LIBL (LOG300:41) - two resolution rules. No caller (c06); errors not inspected (c05)."
    entrypoints:
      - kind: job
        locator: LOG100 (no menu entry; CALL LOG100 by hand)
        evidence: ["ATU_SRC/QRPGLESRC/LOG100.PGM.RPGLE:5-7", "ATU_SRC/QRPGLESRC/LOG100.PGM.RPGLE:11-12", "ATU_SRC/QRPGLESRC/LOG100.PGM.RPGLE:18-26", "ATU_SRC/QPROTOSRC/APICALL.RPGLEINC:4-16"]
    behaviour_doc: features/log-programs-c01.md
    dependencies: [PARAMETER.PF (object / library only), QUSCRTUS, QUSPTRUS]
    open_questions: ["Who runs LOG100 and when (c06)?", "Actual allocated size of SAMLOG on the box (c04)?"]
  - id: log-programs-c02
    name: SAMLOG layout - binary write cursor at offset 0, '***' at offset 4, entries from offset 7
    status: documented
    confidence: observed-in-code
    summary: "Bytes 0-3 = 10i 0 pos (the next-write offset, big-endian), bytes 4-6 = '***', first entry at 7. LOG100 writes the header once; LOG300 reads pos from offset 0 on every call, writes at p1 + pos and adds the logical line length back into offset 0 - the cursor lives inside the space, so it is persistent across jobs and shared by every writer (c10). No record separator: ' ***' at the end of each line is the only delimiter (c03); after the last line up to 600 - len bytes of blanks (padded write), then X'00'. The layout is defined twice (LOG100 based DS; LOG300 standalone based fields) with no shared copybook - byte-compatible by construction. No lower/upper bound on pos, '***' never read back."
    entrypoints:
      - kind: other
        locator: LOG100 / LOG300 based fields
        evidence: ["ATU_SRC/QRPGLESRC/LOG100.PGM.RPGLE:14-16", "ATU_SRC/QRPGLESRC/LOG100.PGM.RPGLE:23-25", "ATU_SRC/QRPGLESRC/LOG300.RPGLE:12-13", "ATU_SRC/QRPGLESRC/LOG300.RPGLE:27-32"]
    behaviour_doc: features/log-programs-c02.md
    dependencies: [SAMLOG *USRSPC (runtime object), QUSPTRUS]
    open_questions: ["Is a migration of existing SAMLOG content wanted (this card is the decoding rule)? Recommendation: no."]
  - id: log-programs-c03
    name: "AddLogEntry - resolve SAMLOG *LIBL once per activation group, append 'User: … * Date: … * Msg: … ***' (600-byte padded write)"
    status: documented
    confidence: observed-in-code
    summary: "Only export of LOG (LOG300 nomain). First call per activation group runs init (inz = *on, then QUSPTRUS 'SAMLOG    *LIBL'). Each call builds 'User: ' + User(10, blank-padded, not trimmed) + ' * Date: ' + %char(%timestamp()) (26 chars) + ' * Msg: ' + %trim(entry) + ' ***' in a 500-varying field, assigns it to the 600-byte fixed field at p1 + pos (600 bytes written, blank-padded), then pos += logical length. Fixed part 63 bytes; ORD700 lines ~122-131 bytes. User is a module static inz(*USER) - stamped at service-program activation in the caller's AG (ACTGRP(*CALLER); QILE for ORD700, inference), not per call. A trimmed message > 437 chars truncates at 500 and loses ' ***' (not reachable in-tree). No monitor, no %error, QUSPTRUS without error code -> failures escape to the caller, who swallows them (callp(e)). A failed init is never retried in the AG (inz set first): later calls fail on the null p1 (c06)."
    entrypoints:
      - kind: api
        locator: LOG AddLogEntry (LOG300)
        evidence: ["ATU_SRC/QPROTOSRC/LOG.RPGLEINC:4-5", "ATU_SRC/QRPGLESRC/LOG300.RPGLE:12-16", "ATU_SRC/QRPGLESRC/LOG300.RPGLE:18-35", "ATU_SRC/QRPGLESRC/LOG300.RPGLE:37-46", "ATU_SRC/QILESRVSRC/LOG.ILESRVPGM:8"]
    behaviour_doc: features/log-programs-c03.md
    dependencies: [SAMLOG *USRSPC, QUSPTRUS, LOG.RPGLEINC, ORD700 (only caller)]
    open_questions: ["Target: is the legacy line string (prefixes, terminator) a contract, or only the Msg text (as the ORD vertical assumed)?", "User stamped at activation vs per call - confirm the target's per-event actor is the intended semantics."]
  - id: log-programs-c04
    name: No capacity check - logging stops silently, permanently, once the 600-byte write crosses the end of SAMLOG (~35 ORD700 lines at 5000 bytes)
    status: documented
    confidence: inferred
    summary: "5000-byte initial size, no auto-extend (QUSCUSAT never called), 600-byte fixed write per call, pos never compared with the size -> space-addressing exception (MCH0601, inference) as soon as pos + 600 > allocated size: from pos ~4400 if the allocation is exactly 5000 = ~35 ORD700 lines of ~125 bytes (Phase A said 40-60); a page-rounded allocation (e.g. 8192) would move it to ~60 lines - runtime fact. The failing assignment (line 31) raises before pos is advanced (line 32), so pos stays put and every later call in every job fails at the same offset: permanent and silent (ORD700 callp(e), %error unread; the log writes nothing to any queue). Deletes keep working. Only reset: re-run LOG100 (c01). Recorded as-is; target has an unbounded samlog table."
    entrypoints:
