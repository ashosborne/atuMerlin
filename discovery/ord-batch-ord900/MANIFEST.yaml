  - id: ord-batch-ord900-c06
    name: ORD901 whole-file rewrite - UF E DISK (update, arrival sequence, no COMMIT keyword), one native UPDATE per row, then two SQL UPDATEs with no SET OPTION COMMIT / handler / COMMIT; partial-run and double-shift-on-rerun characteristics
    status: documented
    confidence: observed-in-code
    summary: "Native side explicitly without commitment control (no COMMIT keyword); SQL side undetermined from source (no SET OPTION in the member - ART200:332 and ART801's header are the only ones in the tree; build = elias compile per iproj.json, options not in tree). No MONITOR, (E), WHENEVER, sqlcod test, *PSSR. Failure mid-loop: rows before shifted, rest not, tail never runs. Rerun: newest order among done rows -> days 0, harmless; else same days -> done rows shifted twice, their delivery/close then zeroed by the future guard. Under COMMIT(*CHG) with unjournaled files the tail fails (SQL7008) after the loop already ran. Runs in the interactive job; record lock per row; no ALCOBJ; an ORD100 confirm mid-run is shifted into the future."
    entrypoints:
      - kind: job
        locator: ORD901 F-spec / loop / tail
        evidence: ["ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:4", "ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:19-50", "ATU_SRC/QRPGLESRC/ART200.PGM.SQLRPGLE:332", "ATU_SRC/QSQLSRC/ART801.SQLPRC:9-20", "iproj.json:14-15"]
