needs_sme:
  - "c07 (room / product owner - Phase A Q1, inferred, carded): are ORD900 / ORD901 (and ART801) ever run against real data, or only to refresh the Arcad sample between demos? Source facts: menu group 'Utilities', texts 'Reset ...', blank %TEXT on exactly these programs (+ORD700, PRO203), ARCAD-generated DTAARA source with a snapshot VALUE(60719), no parameters, no scheduling, no logging. If sample-only: recommend defer the slice from conversion scope (keep as known surface; cards stand as the record). If real: c03/c04 are business rules the target does not implement."
  - "c04 (room, ORD pack - Phase A Q2): the 10-day auto-close rule (open order delivered strictly more than 10 days before today -> ORDATCLO = ORDATDEL + 10) exists only in ORD901; ORD200/ORD201 close on demand at today's date. Business rule or sample convenience? Also: ORD901 is the only in-tree writer that can leave ORDATCLO > 0 with ORDATDEL = 0 (delivery shifted past today and zeroed, close kept)."
  - "c04/c05 (room, ORD pack + ops): ORD901 can close orders (c04) but resyncs only ODYEAR and CULASTORD (c05) - ARCUSQTY / CUCREDIT (ART801 statements 1-2) are left stale until menu option 82 is run; nothing sequences 81 -> 82. Same gap the ord-trigger-ord700 cards record for the interactive close. Confirm the target's stance covers ORD901's closes too, or that the utility is out of scope."
  - "c05 (room, ORD pack - carried from sql-objects-c08): CULASTORD = MAX(ORDATE) is implemented twice (ORD901:46-50 verbatim = ART801:35-37); ORD701 assigns the inserted date instead. Fold into one rule in the target or keep as-is? And: ORD901 is the estate's ONLY writer of DETORD.ODYEAR (ORD100 writes 0) - is odyear needed at all in the target (derivable from the header)?"
  - "c06 (source owner): PRTSQLINF ORD901 / DSPPGM - which COMMIT option the object was built with. The member has no SET OPTION COMMIT (ART801 and ART200 set it explicitly); under the precompiler default *CHG the two tail UPDATEs need journaled files and fail with SQL7008 otherwise - after the row loop has already run."
  - "c06 (room, ORD pack): if a target counterpart exists at all, decide atomic-or-not explicitly. As-is: three independent parts (row loop, ODYEAR update, CULASTORD update), no handler, no COMMIT; a rerun after a mid-loop failure shifts the already-done rows a second time when the newest order was not among them (c03), and their delivery/close dates then hit the future guard and are zeroed (c04)."
  - "c01 (room, ORD pack): the target replaces LASTORDNO with a sequence (modern/db/schema.sql:59-61, read-only). Is a 'reset the sequence to MAX(id)' operator action wanted, or does ORD900 fall with c07? Note the as-is empty-file behaviour: LASTORDNO is written as 0 (not left alone), so the next confirm allocates order 1."
  - "c02/c05 (source owner - carried from sql-objects-c10): 'from order' undelimited at ORD901:11,43,45 vs FROM \"ORDER\" at :47,49 - compile-time check; confirm the object compiles / was compiled as-is."
  - "c08 (ops / source owner): WRKJOBSCDE and any external scheduler on the box - is ORD901 (or ART801) scheduled? Invisible from source; one screen settles it and informs c07."

features:
  - id: ord-batch-ord900-c01
    name: ORD900 - set data area LASTORDNO to the highest existing ORID (SETGT *HIVAL / READP on ORDER1, IN *LOCK, Z-ADD, OUT); empty file -> data area written as 0
    status: documented
    confidence: observed-in-code
    summary: "Eleven fixed-form lines: setgt *hival / readp on ORDER1 (UNIQUE K ORID) gives MAX(ORID); *lock IN, z-add ORID, OUT (unlocks), seton LR. Stores 'last number used' - the contract ORD100 relies on (IN *LOCK, +1, OUT). No %eof test: on an empty ORDER the input field keeps its initial 0 and LASTORDNO is written as 0 (next confirm = order 1). No file lock between READP and IN *LOCK (theoretical race with ORD100 -> duplicate key on ORDER1). Only ORD100 and ORD900 touch the data area. Target replaces it with a sequence and lists ORD900 as not converted."
    entrypoints:
      - kind: job
        locator: ORD900 (menu opt 80, cmd call ord900)
        evidence: ["ATU_SRC/QRPGLESRC/ORD900.PGM.RPGLE:4-11", "ATU_SRC/QPNLSRC/SAMMNU.MENU:143-146", "ATU_SRC/QDDSSRC/ORDER1.LF:4-6", "ATU_SRC/QDTASRC/LASTORDNO.DTAARA:8", "ATU_SRC/QRPGLESRC/ORD100.PGM.RPGLE:56,189-192"]
    behaviour_doc: features/ord-batch-ord900-c01.md
    dependencies: [ORDER1.LF, ORDER.PF, LASTORDNO.DTAARA, ord-entry-ord100-c07, menu-cmd-shell-c01]
    open_questions: ["Empty ORDER -> LASTORDNO written as 0 (sharpened from Phase A 'readp fails/undefined'); target: operator sequence reset wanted at all? (room, ORD pack)"]
  - id: ord-batch-ord900-c02
    name: ORD901 early exit when no orders - SELECT MAX(ORDATE) INTO :lastdate (no indicator), IF lastdate = 0 -> *INLR, RETURN; guard holds via the NULL/-305 path leaving the host variable at its initial zero
    status: documented
    confidence: observed-in-code
    summary: "select max(ordate) into :LastDate from order (undelimited); no indicator variable and no sqlcod test anywhere in the program. Empty file: MAX is NULL -> SQLCODE -305, host variable unchanged (inference), lastdate is a standalone 8 0 initialised to 0 -> test true -> *inlr on, return. Same exit if every ORDATE = 0 (not producible in-tree) or if the SELECT fails for any other reason (silent). ORDER is already open UF at that point (F-spec)."
    entrypoints:
      - kind: job
        locator: ORD901 entry (menu opt 81)
        evidence: ["ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:4,6,11-15", "ATU_SRC/QPNLSRC/SAMMNU.MENU:147-150"]
    behaviour_doc: features/ord-batch-ord900-c02.md
