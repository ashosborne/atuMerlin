    open_questions: ["'from order' undelimited (:11,43,45) - compile-time check (source owner, carried from sql-objects-c10)"]
  - id: ord-batch-ord900-c03
    name: ORD901 - shift every ORDATE forward by days = today - MAX(ORDATE) so the newest order is dated today; ORYEAR recomputed from the shifted date; spacing preserved; same-day rerun idempotent; sign follows the data
    status: documented
    confidence: observed-in-code
    summary: "today = %dec(%date():*iso); days = %diff(%date():%date(lastdate:*iso):*d) (5 0). Arrival-sequence read of ORDER (no key on the PF), every row: ordate = ordate + days, oryear = %subdt(shifted:*Y), update forde. Same-day rerun -> days = 0 -> every row rewritten unchanged (ORDER has no trigger; ORD701 is AFTER INSERT only). Newest order after today -> days < 0 -> whole file moves backwards (no guard). ORDATE = 0 / malformed -> RNQ0112, unhandled, stops mid-file. Rerun after a partial run re-shifts the done rows when the newest order was not among them. ORDER3.LF (K ORDATE) has no reader."
    entrypoints:
      - kind: job
        locator: ORD901 main loop
        evidence: ["ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:16-21", "ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:38-41", "ATU_SRC/QDDSSRC/ORDER.PF:5-14", "ATU_SRC/QRPGLESRC/ORD100.PGM.RPGLE:193-194"]
    behaviour_doc: features/ord-batch-ord900-c03.md
    dependencies: [ORDER.PF, ORDER1.LF, ORDER2.LF, ORDER3.LF, ord-maintain-ord200-c01, ord-maintain-ord201-c01, ord-print-ord500]
    open_questions: ["Is date-shifting ever run against real data? (room, ORD pack - Phase A Q1; see c07)"]
  - id: ord-batch-ord900-c04
    name: ORD901 derived delivery/close dates - both shifted by the same offset, any result after today reset to 0; open order delivered strictly more than 10 days ago closed at ORDATDEL + 10 (hidden auto-close rule); only in-tree path to closed-without-delivery
    status: documented
    confidence: observed-in-code
    summary: "ORDATDEL > 0 -> shift; > today -> 0. ORDATCLO > 0 -> shift; > today -> 0 (reopened). ELSE (open): if ORDATDEL > 0 and ORDATDEL < lastdate (= today - 10, c09) -> ORDATCLO = ORDATDEL + 10 days (always in the past). Uses the already-shifted/zeroed ORDATDEL; the closed branch does not re-check delivery -> ORDATCLO > 0 with ORDATDEL = 0 possible (needs ORDATDEL > ORDATCLO in source data; interactive close always sets both). Boundary strict: exactly 10 days stays open. Closing here changes ART801's/ORD700's open set but ARCUSQTY/CUCREDIT are not recomputed (c05); nothing sequences opt 81 -> 82. Interactive writers of the same fields: ORD200/ORD201 opt 7 (close) / 8 (deliver)."
    entrypoints:
      - kind: job
        locator: ORD901 main loop
        evidence: ["ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:16-18", "ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:22-37", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:244-259", "ATU_SRC/QSQLSRC/ART801.SQLPRC:23-33"]
    behaviour_doc: features/ord-batch-ord900-c04.md
    dependencies: [ORDER.PF, ord-maintain-ord200, ord-maintain-ord201, ord-trigger-ord700-c10, sql-objects-c01]
    open_questions: ["10-day auto-close: business rule or sample convenience? (room, ORD pack - Phase A Q2)", "ORD901 closes leave ARCUSQTY/CUCREDIT stale until ART801 - covered by the target's as-is stance? (room / ops)"]
