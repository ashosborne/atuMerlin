  - id: ord-batch-ord900-c09
    name: Variable reuse trap in ORD901 - lastdate holds MAX(ORDATE) for two statements, then is silently reassigned to today - 10 and used under that meaning in the close rule; today used only by the future guards; the 10-day constant written twice
    status: documented
    confidence: observed-in-code
    summary: "lastdate: newest order date at :11-17 (guard, offset), then today - 10 at :18, consumed only at :34 (ordatdel < lastdate = 'delivered more than 10 days ago'). Read literally at :34 it says 'delivered before the newest order' - a different rule. :18 must stay after :17 and before the loop; moving it above :17 gives a constant 10-day shift that still compiles. today (:16) used at :24, :30 only. %days(10) at :18 (threshold) and :35 (close offset) encode one parameter (grep: the only two occurrences in the tree). Arithmetic correct as-is; card exists so a review or conversion does not rename-and-change the rule."
    entrypoints:
      - kind: other
        locator: ORD901 lines 11-18, 24, 30, 34-35
        evidence: ["ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:6-8", "ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:11-18", "ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:24,30,34-35"]
