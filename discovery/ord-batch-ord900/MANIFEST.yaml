    summary: "(1) UPDATE detord SET odyear = (SELECT oryear FROM order WHERE d.odorid = orid) WHERE odyear <> (same) - correlated on ORID only, differential; ORD100 writes ODYEAR = 0 and nothing else assigns it (grep) so this is where ODYEAR gets its value; each changed line fires ORD700U (TRGUPDCND(*CHANGE)) -> event '3' -> UpdArt(0) -> return (no ARTICLE write). Orphan lines skipped (NULL comparison). (2) UPDATE CUSTOMER SET CULASTORD = MAX(ORDATE) WHERE EXISTS - identical text to ART801:35-37; customers without orders untouched; differs from ORD701 (assigns inserted date). No COMMIT, no handler; a failure in (2) leaves loop + (1) applied. ODYEAR has no reader in the tree and is in DETORD.PF's key but not DETORD1's."
