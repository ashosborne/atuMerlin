    name: ORD901 tail - UPDATE DETORD.ODYEAR to the header's ORYEAR (the estate's only writer of ODYEAR; fires ORD700U as a zero-delta no-op) and UPDATE CUSTOMER.CULASTORD = MAX(ORDATE) (verbatim ART801 statement 3); ARCUSQTY/CUCREDIT not resynced
    status: documented
