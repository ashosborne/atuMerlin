needs_sme:
  - "c11 (room): treat PATH as target configuration, not a maintained table row - one key, one column, four literal readers (ORD500, PRO202, PRO203, PAR201), GetPARM1/3/4/5 and ClosePARAMETER have no caller. If yes, PAR200 (c01-c06) and PAR201 (c07) have nothing left to maintain or browse and PARAMETER (c12) has no purpose in the target; LOG100 loses its library anchor (c13)."
  - "c07 / c11 (data): does the PATH value on the box end with '/'? PRO202 / PRO203 concatenate %trim(path) + fileName with no separator, ORD500C uses TODIR (separator-tolerant), PAR201 lists <PATH>* - without the slash the XML / spreadsheet files are written beside the directory, not in it. Also: which file system (root is case-insensitive, QOpenSys is not); do any other PARAMETER rows exist (nothing in source reads them)."
  - "c08 (inferred, carded): a missing or blank PATH is silent in this slice - GetPARM2 returns 100 blanks, PAR201 runs WRKLNK '*' (current directory), PRO202 / PRO203 open relative file names, ORD500C passes a blank TODIR. Where the files end up and whether the XML / XSS service programs or CVTSPLPDF reject a blank/relative name is outside the tree. Target: required setting (fail fast) or default location?"
  - "c09 (target): getter cache keyed on the record buffer's own PACODE/PASUBCODE - a hit is served stale until a different key is requested (never, in-tree), so the first PATH read in a job is the value for the job (QILE shared by all four consumers); a miss is never cached; a blank key never reads. Read-once-per-job acceptable for a single setting, or read-through / configuration? Same question as cou-maintain-c07."
  - "c05 (Phase A corrected): option 4 deletes immediately with no confirmation, and the '*** Deleted ****' marker never reaches the screen - PARM2 is not a subfile field (the list shows PARM2S). The ghost row shows blank Code / Sub-Code / 1 and the old 2-5 values; option 4 on the ghost deletes the blank/blank row if one exists. Acceptable as-is if the screen survives?"
  - "c03 (Phase A sharpened): after F6 (create or cancel) the list runs the Page Down path from the saved key; at Bottom the saved key is the last displayed row, so that row is appended a second time. c04: edited rows keep their pre-edit values in the list until F5. As-is display quirks; preserve only if the screen is kept."
  - "c02 / c04: create validates the duplicate key only (blank code / sub-code allowed, values unvalidated, no audit); the duplicate check chains the update-capable file and leaves the existing row locked while the error shows; edit chains with a lock held across the screen and updates unconditionally; option 2 on a ghost row (or a row deleted by another job) -> chain miss -> update without prior read -> unmonitored RPG 01221. Record as-is; one lock/ghost-row answer for the estate's list/edit template (CUS200 is the same shape)."
  - "c10 (build owner / ME): EXPORT(*ALL), no binder source - chainPARAMETER and closePARAMETER exported, signature generated, no *PRV; closePARAMETER would not reset the cache key. Target exposes the getters only. Also: activation group of ORD500 / PRO203 (dftactgrp(*no), no ACTGRP -> QILE inferred) decides the cache scope; how ORD500 / PRO203 bind FPARAMETER is build metadata (srvpgm-supporting-c05)."
  - "c13 (deployment): SAMLOG is created in whatever library resolves PARAMETER on *LIBL at LOG100 time and found later via *LIBL - two resolution rules; if PARAMETER disappears in the target, log-programs needs a new location rule (their card)."
  - "c01 / c06: page geometry (14 rows, lines 7-20), leading zeros on un-edited numeric output (PARM4 / PARM5), options typed before Page Down / F6 surviving to the next Enter, F3 = F12 on the list, F3 on detail panels returning to the list - DDS / platform contract, runtime-confirmable."

features:
  - id: par-maintain-c01
    name: List parameters with paging, F5 refresh, options 2/4
    status: documented
    confidence: observed-in-code
    summary: "PAR200 (menu opt 20, no parameters, no H spec, cycle-driven panel/step machine) reads PARAMETER directly (uf a) in key order (PACODE, PASUBCODE): 14 rows per load with a look-ahead read so Bottom is exact (no empty trailing page); saved key = the unread 15th record (at EOF: the last displayed row); Page Down appends 14 from the saved key (SFLSIZ 15 != SFLPAG 14 auto-extend, PAGEDOWN N80 - display-handled after Bottom); F5 clears and reloads from the top; RRB01 = LRRN keeps the page. Columns Opt / Code / Sub-Code / 1 / 2 (PARM2S = first 32 of PARM2; PARM2 itself is not a subfile field) / 3 / 4 / 5 (numeric, no EDTCDE -> leading zeros). Options 0/2/4 only; others RI + SFLMSG 'Invalid Option', first bad row paged to, all changed rows kept with SFLNXTCHG. s01act processes ONE changed row per cycle pass, so several 2s / 4s run in RRN order. No filter, position-to, search or help. The subfile is a snapshot: created (c03), edited (c04) and deleted (c05) rows are not re-read until F5. Empty file -> headings, no message. Options typed before Page Down / F6 survive to the next Enter; F3/F5/F12 discard them."
    entrypoints:
      - kind: screen
        locator: PAR200 CTL01/SFL01 (menu opt 20)
        evidence: ["ATU_SRC/QRPGLESRC/PAR200.PGM.RPGLE:5-9", "ATU_SRC/QRPGLESRC/PAR200.PGM.RPGLE:81-196", "ATU_SRC/QDDSSRC/PAR200D.DSPF:13-81", "ATU_SRC/QPNLSRC/SAMMNU.MENU:135-138"]
