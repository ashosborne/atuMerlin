  - id: par-maintain-c13
    name: LOG100 uses PARAMETER's library as the application library
    status: documented
    confidence: observed-in-code
    summary: "LOG100 opens PARAMETER (if e k disk, implicit open, no read) only to take the opened file's library from INFDS bytes 93-102 and build the qualified name 'SAMLOG    ' + Lib for QUSCRTUS (LOG, 5000 bytes, X'00', *ALL, replace *YES); LOG300 later finds the space with 'SAMLOG    *LIBL'. So the library that resolves PARAMETER on *LIBL at install time is 'the application library' for the log - a dependency on the object, not on any row; two resolution rules (INFDS at create, *LIBL at run). errcod never inspected; PARAMETER missing -> unmonitored open failure before anything is created (inference). If PARAMETER disappears in the target (c11), log-programs needs a new location rule. Log behaviour itself: log-programs-c01 (accepted, not deepened here)."
