        locator: FPARAMETER GetPARM1..GetPARM5 (PAR300)
        evidence: ["ATU_SRC/QRPGLESRC/PAR300.RPGLE:22-80", "ATU_SRC/QRPGLESRC/PAR300.RPGLE:82-107", "ATU_SRC/QPROTOSRC/PARAMETER.RPGLEINC:7-37", "ATU_SRC/QILESRVSRC/FPARAMETER.ILESRVPGM:8"]
