    summary: "CORRECTED (Pack B run 16, srvpgm-supporting-c06): EXPORT(*ALL) exports module exports only - PAR300 puts export on GetPARM1-5 (:22,34,46,58,70) and not on chainPARAMETER (:82) / closePARAMETER (:100), so FPARAMETER exports FIVE procedures; ClosePARAMETER in the copybook has no export behind it (a call would fail to bind); chainPARAMETER is unreachable from outside. Original text: CRTSRVPGM SRVPGM(&O/&N) MODULE(PAR300) ACTGRP(*CALLER) EXPORT(*ALL); no QSRVSRC/FPARAMETER.BND -> [all seven procedures exported - wrong, see above] in source order, signature generated, no *PRV (any export change -> MCH4431 in bound programs until re-bound). Copybook publishes GetPARM1-5 + ClosePARAMETER but not chainPARAMETER. Contrast FCOUNTRY (EXPORT(*SRCFILE) hides closeCOUNTRY - cou-maintain-c11), FPROVIDER (only versioned binder). Latent: ClosePARAMETER would close the ODP but not clear the buffer, so the cache key survives a close - a caller adding ClosePARAMETER() to 'refresh' PATH would not get a refresh for the same key. Callers bound: PAR201 / PRO200 explicit BNDSRVPGM; SAMPLE.BNDDIR entry for bnddir('SAMPLE') programs; ORD500 / PRO203 by build metadata only. Build note; target exports the getters only."
