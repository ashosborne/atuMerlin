  - id: par-maintain-c09
    name: GetPARM1..5 getter family with two-part cached chain
    status: documented
    confidence: observed-in-code
    summary: "PAR300 nomain: five exports (GetPARM1 10A, GetPARM2 100A, GetPARM3 2A, GetPARM4 1P 0, GetPARM5 3P 0; each (PACODE 10A value, PASUBCODE 10A value)) over one private chainPARAMETER: open guard on the USROPN input file (opened on first call, never closed - closePARAMETER has no caller); cache test P_PACODE <> PACODE or P_PASUBCODE <> PASUBCODE against the RECORD BUFFER's own key fields: hit -> no I/O, served until a different key is requested (never, in-tree - so the first PATH read in a job is the value for the job); miss -> clear *all FPARAM then chain -> blanks / zeros returned, %found not exposed, miss never cached; blank key never reads (the blank/blank row PAR200 can create is unreachable). Case-sensitive 10A compare (PAR200 upper-cases keys on entry). No (e) / monitor: open or chain failure propagates to the caller. ACTGRP(*CALLER): PAR201 / PRO200 explicit QILE, ORD500 / PRO203 dftactgrp(*no) -> QILE by default (inference) -> one buffer and one ODP per interactive job across all four consumers. Reads through PAR200's locks (if open). Same idiom as cou-maintain-c07 / FCUSTOMER."
    entrypoints:
