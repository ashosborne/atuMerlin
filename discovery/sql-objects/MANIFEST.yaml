needs_sme:
  - "c01 (room, ORD pack - Phase A Q1): ORDERCUS is an inner join, so an order whose customer row is missing is listed nowhere in the estate. The only in-tree way to reach that state is ORD100 accepting an unchecked ORCUID (no in-tree path deletes a CUSTOMER row or sets CUDEL). The ORD conversion kept the join as-is and records it as a preserved planted defect; confirm that stays the intended definition of the order lists."
  - "c02 (room, ORD pack): TOTVAL sums ODTOTVAT (VAT-inclusive) - the list total is gross, the same field ART801 sums into CUCREDIT. Confirm the target list total stays gross; nothing on the legacy screens labels it either way."
  - "c04 (source owner - Phase A Q2, inferred, carded): retrieve ARTQRY (RTVQMQRY) and, if any, its form; also CUSQRY / CUSQRYFMT. Settles whether ARTLSTDAT is read at all (and by what SQL) and closes the report-side blind spot registered by menu-cmd-shell-c02. Until then ARTLSTDAT stays a defer for any target decision."
  - "c03 (room, when ARTQRY is seen): ARTLSTDAT's QUANTITY is total ORDERED quantity over all orders (open + closed, delivered or not) - a different number from ARTICLE.ARCUSQTY (open, outstanding). Soft-deleted articles keep appearing; never-ordered ones do not. Confirm that is the report the business wants before reproducing the view."
  - "c05 (art-* owner, when ART is bound): ART200 treats any sqlcod <> 0 on the ARTIINF read as 'no row' and then INSERTs; if the row exists the INSERT fails on the primary key and the failure is unchecked - the edit is silently lost. Record as-is defect or accept? Not fixed here (ART held)."
  - "c05 (room, data migration): ARTIINF's two columns are CCSID 297 (EBCDIC France) - the only explicit data-column CCSID in the estate (SAMMSGF is 297 too). Confirm the character-set mapping for the free text; the DDS files carry no CCSID."
  - "c06 (room, art-* owner): ARTIINF rows are never deleted and a soft-deleted article's text stays editable via option 3. Keep as-is or hide/delete with the article in the target? Decide in the ART Architecture pack when it exists."
  - "c07 (room, CUS pack): CUID is 5P 0 but CUSSEQ has NO MAXVALUE - the 98 450th value (100 000) overflows the host variable and CUS200 does not test sqlcod after the SET. Theoretical at the estate's size; decide MAXVALUE 99999 vs a wider column for the target. The CUS conversion draws nextval at save rather than on F6 - its own documented decision, not touched."
  - "c08 (room / ops, ORD pack): who runs menu option 82 (ART801) and when? No schedule or guard in the tree. Decides whether the target needs an operator-facing 'reset summary fields' action. ORD901 duplicates ART801's CULASTORD statement inline (ord-batch-ord900, queue)."
  - "c09 (room, ORD pack): ART801 runs with COMMIT = *NONE and no handler - a failure in statement 2 or 3 leaves statement 1 applied. Recommendation: make the target reset atomic (no reader depends on the half-applied state); room decides."
  - "c10 (ME / room): naming contract - keep the LABEL ON texts as COMMENT ON (only column documentation the estate has), drop the positional 20-char headings, canonicalise ARTIINF on its long names when the ART pack is drafted; ORD901 writes `from order` undelimited three times (lines 11, 43, 45) and `FROM \"ORDER\"` twice - flag as a compile-time check for ord-batch-ord900."

features:
  - id: sql-objects-c01
    name: ORDERCUS view - "ORDER" inner-joined to CUSTOMER on ORCUID = CUID, one row per order, TOTVAL correlated over DETORD; orders without a customer row are invisible
    status: documented
    confidence: observed-in-code
    summary: "Comma join => inner; CUSTOME1 UNIQUE on CUID so no duplication; CUSTNM the only CUSTOMER column; TOTVAL = COALESCE((SELECT SUM(ODTOTVAT) FROM DETORD WHERE H.ORID = ODORID), 0) - join on ORID only, 0 for a line-less order; no CUDEL or ORDATCLO filter; dates pass through as 8 0 numerics (readers apply ISOTODATE40). Sole read path of ORD200 (one customer) and ORD201 (all). Orphan orders arise in-tree only from ORD100's unchecked ORCUID (no in-tree customer delete, no CUDEL writer). Readers fetch TOTVAL into SUMORD 11Y 2 - an oversized total would end the load loop silently."
    entrypoints:
      - kind: other
        locator: ORDERCUS (read by ORD200 / ORD201)
        evidence: ["ATU_SRC/QSQLSRC/ORDERCUS.VIEW:5-34", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:105-128", "ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:98-120", "ATU_SRC/QDDSSRC/CUSTOME1.LF:4-6"]
    behaviour_doc: features/sql-objects-c01.md
    dependencies: [ORDER.PF, ORDER1.LF, CUSTOMER.PF, CUSTOME1.LF, DETORD.PF, DETORD1.LF, ord-maintain-ord200-c01, ord-maintain-ord201-c01]
    open_questions: ["Should orders for missing customers vanish in the target? (room, ORD pack - as-is kept by the ORD conversion)"]
  - id: sql-objects-c02
    name: TOTVAL sums ODTOTVAT (line total with VAT), not ODTOT - both order lists show gross totals
    status: documented
    confidence: observed-in-code
    summary: "DETORD carries ODTOT (net) and ODTOTVAT (TEXT 'TOTAL LINE WITH VAT', 9P 2); the view sums the latter over all lines regardless of delivery or order status, no rounding. Writers set odtotvat = odtot + vat (ORD100/ORD101). Same field ART801 sums into CUCREDIT, so list total and credit share one gross definition. Displayed as SUMORD 11Y 2 EDTCDE(2) with no heading that says VAT-inclusive."
    entrypoints:
      - kind: other
        locator: ORDERCUS TOTVAL
        evidence: ["ATU_SRC/QSQLSRC/ORDERCUS.VIEW:17-19", "ATU_SRC/QDDSSRC/DETORD.PF:16-20", "ATU_SRC/QDDSSRC/ORD200D.DSPF:28", "ATU_SRC/QSQLSRC/ART801.SQLPRC:29-33"]
    behaviour_doc: features/sql-objects-c02.md
    dependencies: [DETORD.PF, SAMREF.PF, sql-objects-c01, ord-trigger-ord700-c10]
    open_questions: ["Target list total stays gross? (room, ORD pack)"]
  - id: sql-objects-c03
    name: ARTLSTDAT view - per article MAX(ORDATE) as LASTORDER and SUM(ODQTY) as QUANTITY over all orders, three-way inner join; never-ordered articles absent, soft-deleted present
    status: documented
    confidence: observed-in-code
    summary: "SELECT ARID, ARDESC, MAX(ORDATE), SUM(ODQTY) FROM ARTICLE, \"ORDER\", DETORD WHERE ARID = ODARID AND ODORID = ORID GROUP BY ARID, ARDESC. Inner joins: an article needs >= 1 line whose header exists; orphan lines excluded (they still count in ORDERCUS.TOTVAL). Join on ORID only (ODYEAR unused, like ART801). No ARDEL / ORDATCLO filter. QUANTITY is ordered qty over open + closed orders - not ARCUSQTY. GROUP BY ARDESC shows the current description (one per ARID via ARTICLE1 UNIQUE). Labels for ARID / ARDESC only (SAMREF COLHDG copies incl. 'DESCRPTION'). No reader in ATU_SRC (c04)."
    entrypoints:
      - kind: other
        locator: ARTLSTDAT
        evidence: ["ATU_SRC/QSQLSRC/ARTLSTDAT.VIEW:5-22", "ATU_SRC/QDDSSRC/ARTICLE1.LF", "ATU_SRC/QDDSSRC/ORDER1.LF", "ATU_SRC/QDDSSRC/DETORD1.LF"]
    behaviour_doc: features/sql-objects-c03.md
    dependencies: [ARTICLE.PF, ARTICLE1.LF, ORDER.PF, ORDER1.LF, DETORD.PF, DETORD1.LF, sql-objects-c04]
