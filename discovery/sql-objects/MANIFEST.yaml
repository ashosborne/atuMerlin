  - id: sql-objects-c09
    name: ART801 interface facts - LANGUAGE SQL, NOT DETERMINISTIC, MODIFIES SQL DATA, CALLED ON NULL INPUT; COMMIT *NONE, DYNUSRPRF *USER, SRTSEQ *HEX, ALWCPYDTA *YES, ALWBLK *ALLREAD, DECRESULT (31,31,00), DLYPRP *NO, DYNDFTCOL *NO; no parameters, no result set, no handler
    status: documented
    confidence: observed-in-code
    summary: "Thirteen header clauses tabulated with their effect on the body. Consequential: COMMIT = *NONE (three independent, immediately visible UPDATEs; partial reset on failure), no DECLARE HANDLER (first SQL error ends the procedure, SQLSTATE surfaces to the CALL), DECRESULT (31,31,00) (SUMs computed wide then assigned to ARCUSQTY 5 0 / CUCREDIT 9P 2 - overflow is an error, not truncation), DYNUSRPRF *USER (no dynamic SQL in the body - default spelled out). SRTSEQ *HEX irrelevant (numeric comparisons). Statement 3 has no DETORD join (line-less orders still set CULASTORD) while 1-2 skip them. Caller learns nothing on success."
    entrypoints:
      - kind: other
        locator: ART801 SET OPTION
        evidence: ["ATU_SRC/QSQLSRC/ART801.SQLPRC:6-20", "ATU_SRC/QDDSSRC/SAMREF.PF:47-52", "ATU_SRC/QDDSSRC/CUSTOMER.PF:19-22"]
    behaviour_doc: features/sql-objects-c09.md
