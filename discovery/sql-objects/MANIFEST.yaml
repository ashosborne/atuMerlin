    status: documented
    confidence: observed-in-code
    summary: "Only SQL-defined table in the estate. Long names + FOR SYSTEM NAME / FOR COLUMN; PK added by ALTER TABLE (PRIM_ARTIINF); no FK to ARTICLE. ART200 panel 3: SELECT ARTICLE_INFORMATION INTO :text (1520A CHECK(LC) screen field, 19 x 80); sqlcod <> 0 => crt else upd; Enter always writes (UPDATE or INSERT of TRIM(:text)); F3/F12 no write; no sqlcod test after the write; set option commit = *none (the only SET OPTION in QRPGLESRC). ART302 reads artinf by arid (short names) into a fixed 1520. Traps: any read error => create => duplicate-key INSERT unchecked (edit lost); TRIM strips leading blanks; empty text stores ''; CCSID 297 is the only explicit data-column CCSID (SAMMSGF also 297). ART cited for the ARTIINF statements only - nothing invented about GetArtInfo."
