    name: CVTSPLPDF command parameter contract - 3 required + 11 optional, PMTCTL only (no DEP), processing program bound at CRTCMD time - outside the tree
    status: documented
    confidence: observed-in-code
    summary: "CMD PROMPT('Convert Spool to PDF'); FROMFILE *NAME 10, TOSTMF *NAME 64, TODIR *PNAME 256 all MIN(1); JOB qualified dft *; SPLNBR *DEC 4 dft *ONLY (*LAST -2, *ONLY -3); STMFOPT *NONE|*REPLACE; STMFCODPAG *DEC 5 dft 1250 (*PCASCII -1, *STMF -2) PMTCTL(*PMTRQS); TITLE *CHAR 50 dft *NONE (*STMFILE); PAGESIZE LIST3 dft *SPLF (*CUSTOM; *A4 *A5 *LETTER *LEGAL *EXEC; *LANDSCAPE dft | *PORTRAIT); CUSTOMPAGE LIST4 (210 x 297 *MM) PMTCTL(CUSTOM); FONT LIST5 dft *CONVERT (14 faces; size 4-36, *CALC -1); BOOKMARK *PAGNBR|*POS|*KEY|*NONE; BMARKPOS LIST1 / BMARKKEY LIST2 (key 378 VARY *INT2) via PMTCTL(POS)/(KEY). Sharpened: command source NEVER names its processing program (CRTCMD PGM()) and no CRTCMD exists anywhere in ATU_SRC - same blind spot for CRTORD (ord-entry-ord100-c09). PMTCTL governs prompting only; no DEP -> no cross-parameter validation. TOSTMF TYPE(*NAME) restricts file names to simple-name rules ('Custord123.pdf' passes; blanks/hyphens rejected - inference). One caller ORD500C (ord-print-ord500-c03): A4 portrait, Courier 11, *REPLACE, *LAST, no bookmarks; defaults JOB(*), STMFCODPAG(1250), TITLE(*NONE). Integration edge."
    entrypoints:
      - kind: other
        locator: CVTSPLPDF.CMD
        evidence: ["ATU_SRC/QCMDSRC/CVTSPLPDF.CMD:4-95", "ATU_SRC/QCLSRC/ORD500C.PGM.CLLE:11-14", "ATU_SRC/QCMDSRC/CRTORD.CMD:4-6"]
    behaviour_doc: features/menu-cmd-shell-c07.md
