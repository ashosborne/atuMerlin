needs_sme:
  - "c02 (inferred, carded): source owner - supply CUSQRY, ARTQRY (*QMQRY) and CUSQRYFMT (*QMFORM), and name the library that holds them and ADSPUSRSPC. Two reports and the log viewer are otherwise unscannable; their menu titles ('Customer with Open Order', 'Article by Last Order Date') are the only specification in the tree. Option 11 does not exist (removed option - inference)."
  - "c03 (room, Phase A Q2): should the target expose any equivalent of the long command line and the F6 DSPMSG / F10 DSPJOBLOG / F14 WRKSBMJOB *USER operator keys? Recommendation: no - IBM i-isms; treat as platform observability. Security as-is: the menu adds no restriction; LMTCPB on the user profile is what governs the command line (box fact)."
  - "c07 (ops / build owner): which product supplies CVTSPLPDF and which library; DSPCMD CVTSPLPDF on the box gives the processing program (command source never names it - that is CRTCMD PGM(), and no CRTCMD exists anywhere in ATU_SRC; CRTORD shares the blind spot, ord-entry-ord100-c09). Default STMFCODPAG(1250) not overridden by ORD500C - effect unknown."
  - "c05 / c06 (room): carry the nine live SAMMSGF texts as a target message resource keyed by id; drop ERR0003/ERR0004/ERR0005 (dead) or keep as reserved ids? Spelling 'Familly' (ERR0001) is consistent with the tree - decide once for the target. Mandatory-field texts are DSPF literals, not in SAMMSGF (ART200D, CUS200D) - an 'all messages from the file' assumption is false."
  - "c01 (room): which of the 20 options the target menu should have at all - 80/81/82 are unguarded destructive resets, 84 is a log dump, 90 is signoff. The option table is the navigation spec; the choice is the room's."
  - "c04 (room): there is no help content to carry (bodies are 'Text' / 'Help not available'); three help names undefined (h, srt200, ord100), one orphan module (ART200), option 3 mis-targeted at cus200. Confirm 'no help to preserve'."
  - "c08 (runtime-confirm): a screen capture of SAMMNU settles the ZMENU corner id (menu manager supplies the menu name - inference), the sysnam separator and the exact CPD9817 text; submsgf=sammsgf is declared but no msg reference uses it."
  - "c09 (pro-interactive, metadata): PRO250.PGM.RPGLE:2 and PRO250D.DSPF:2 %TEXT say 'Display Article' (copy from ART250) while the screen says 'Provider by Id' - object text wrong, user text right; correction belongs to that slice (not made; ATU_SRC untouched). Target labels: use the menu titles, normalise case/plural once; option 7 'Article by id' vs screen 'Article by Code'."

