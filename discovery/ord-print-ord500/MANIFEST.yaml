  - id: ord-print-ord500-c05
    name: Callers of ORD500
    status: documented
    confidence: observed-in-code
    summary: "Exactly three call sites under ATU_SRC, all RPG, synchronous, orid by reference through Prtord extpgm('ORD500'), none monitored, no result read: ORD100 prints EVERY confirmed order right after writing header + lines and before the FMT03 window 'The order is printed.' (unconditional - no print? prompt; user waits for spool + PDF); ORD200 / ORD201 option 6 with no state or existence guard, then opt01 = 0, update sfl01, no reload (screen unchanged). ORD101 declares the prototype and never calls it (ord-entry-ord101-c08) - line changes reach the document only on a re-print. No menu, CMD, CL or scheduler entry; ORD500C called only by ORD500. Ghost row / concurrent delete + option 6 -> the c08 exception in the list program's session (twin of ord-maintain-ord202-c04). Delivered/closed orders re-print identically and replace the PDF. A failure in the print path leaves the ORD100 order written and the confirmation window unshown."
    entrypoints:
      - kind: other
        locator: extpgm ORD500 from ORD100 / ORD200 / ORD201
        evidence: ["ATU_SRC/QRPGLESRC/ORD100.PGM.RPGLE:30-31", "ATU_SRC/QRPGLESRC/ORD100.PGM.RPGLE:190-212", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:27", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:240-243", "ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:24", "ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:246-249", "ATU_SRC/QRPGLESRC/ORD101.PGM.RPGLE:27-28"]
    behaviour_doc: features/ord-print-ord500-c05.md
    dependencies: [ORD100.PGM.RPGLE, ORD200.PGM.SQLRPGLE, ORD201.PGM.SQLRPGLE]
    open_questions: ["needs-SME: print mandatory and synchronous on every confirm in the target, or optional / asynchronous?", "needs-SME / room: not-found answer for option 6 (same as option 5 / ORD202)."]
  - id: ord-print-ord500-c06
    name: Direct file access instead of service programs
    status: documented
    confidence: observed-in-code
    summary: "farticle1 / fcustome1 if e k disk chained directly (chain odarid article1 per line, chain orcuid custome1 once; no %found, no clear) where ORD100:117,266 / ORD101:114,223 call FARTICLE.GetArtDesc and ORD100:328 / ORD101:283 call FCUSTOMER.GetCusName. Miss semantics differ: FARTICLE.chainARTICLE1 clears *all FARTI first -> blank; ORD500 leaves the buffer -> previous line's ARDESC repeated (blank on the first line). Missing customer -> ORCUID printed, six blank address lines. ARDEL / CUDEL never tested (deleted rows print normally). Only service dependency: FPARAMETER via /COPY PARAMETER.RPGLEINC; H spec has dftactgrp(*no) and NO bnddir, no .ILEPGM under QILESRC (srvpgm-supporting-c05 blind spot: binding is ARCAD/elias build metadata); FPARAMETER listed in SAMPLE.BNDDIR which ORD500 does not name. Four LFs open/close per call (*inlr); PARAMETER stays open inside FPARAMETER (c02). Same seams as the list twins (ORDER1/DETORD1), no ORDERCUS view - an order with no customer row prints with a blank block."
    entrypoints:
      - kind: other
        locator: ORD500 F-specs / chain custome1 / chain article1
        evidence: ["ATU_SRC/QRPGLESRC/ORD500.PGM.RPGLE:4", "ATU_SRC/QRPGLESRC/ORD500.PGM.RPGLE:8-13", "ATU_SRC/QRPGLESRC/ORD500.PGM.RPGLE:33", "ATU_SRC/QRPGLESRC/ORD500.PGM.RPGLE:46", "ATU_SRC/QRPGLESRC/ART300.RPGLE:114-127", "ATU_SRC/QBNDSRC/SAMPLE.BNDDIR:8-14"]
    behaviour_doc: features/ord-print-ord500-c06.md
    dependencies: [ORDER1.LF, DETORD1.LF, CUSTOME1.LF, ARTICLE1.LF, FPARAMETER.ILESRVPGM]
    open_questions: ["Build owner: how FPARAMETER is bound (no bnddir / .ILEPGM); activation group.", "needs-SME / room: one article / customer lookup rule for the target (legacy: FARTICLE blank vs ORD500/ORD202 stale carry-over)."]
  - id: ord-print-ord500-c07
    name: Code quirks (datord overwrite, unused oflind, early *inlr)
    status: documented
    confidence: observed-in-code
    summary: "Nine as-is oddities, none changing the document for a found order: (1) datord = %date() dead - overwritten unconditionally, not a guard (the missing guard is c08); (2) oflind(overflow) declared with no D-spec (compiler-implicit indicator - inference) and never tested -> the program owns overflow and ejects only via count > 14 + HEADER SKIPB(005); (3) *inlr = *on before total/footer/close/getParm2/pdfOrd - harmless, and the reason every call is fresh; (4) id parameter used once, record field orid thereafter (equal when found; never written back); (5) %trim(%char(orid)) redundant - the real issue is the 5-byte const target (c02); (6) page break re-writes header + header3, not header2 (customer block page 1 only); (7) totnet/tottot/totvat/datord have no D-spec - they are the printer-file output fields (9P 2 EDTCDE(2); L); (8) placeholder literals 'This is the footer' / 'Company Sample' address hard-coded in the DDS; (9) count 3u 0 never above 15. NOT a quirk: close ord500o before ORD500C is load-bearing - it completes the spooled file that SPLNBR(*LAST) converts. Recorded as-is; carry-or-normalise is a room decision for the ORD pack."
    entrypoints:
      - kind: other
        locator: ORD500 main
        evidence: ["ATU_SRC/QRPGLESRC/ORD500.PGM.RPGLE:6", "ATU_SRC/QRPGLESRC/ORD500.PGM.RPGLE:22-26", "ATU_SRC/QRPGLESRC/ORD500.PGM.RPGLE:30-32", "ATU_SRC/QRPGLESRC/ORD500.PGM.RPGLE:40-43", "ATU_SRC/QRPGLESRC/ORD500.PGM.RPGLE:53-59"]
    behaviour_doc: features/ord-print-ord500-c07.md
    dependencies: []
    open_questions: ["Build owner: compile listing for the implicit 'overflow' indicator.", "Room (ORD pack): carry or normalise (customer block on page 1 only; placeholder footer)."]
  - id: ord-print-ord500-c08
    name: "Unknown order id: unmonitored date exception, not a blank document (Phase A corrected)"
    status: documented
    confidence: observed-in-code
    summary: "chain id order1 untested, then datord = %date(ORDATE:*iso) unguarded: a miss leaves ORDATE = 0 (fresh call, c07) -> %date(0) invalid -> RPG status 00112, no monitor/(e)/*PSSR -> unmonitored exception BEFORE the first write. No document (blank or otherwise), no PDF, PATH not read; failure surfaces in the caller's interactive session (inference: RNQ0112 inquiry). The printer file was opened at program start, so a spooled file was created - its disposition after the abnormal end is runtime-confirmable. Phase A 'prints with blank header fields' corrected - that path is unreachable as written. Producers: ORD200 / ORD201 option 6 on a ghost row (ORD201 blanks to orid 0, ORD200 leaves the deleted id) or after a concurrent delete; direct CALL; not ORD100. Zero/invalid stored ORDATE fails the same way (no in-tree writer stores 0). Missing customer is the different, non-fatal case (blank block, c06). After the exception the list program's option 6 is still on the row (opt01 = 0 follows the call). Twin of ord-maintain-ord202-c01 (same two statements)."
    entrypoints:
      - kind: other
        locator: ORD500 chain order1 / %date(ORDATE)
        evidence: ["ATU_SRC/QRPGLESRC/ORD500.PGM.RPGLE:30-33", "ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:83-85", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:240-243", "ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:246-249"]
    behaviour_doc: features/ord-print-ord500-c08.md
    dependencies: [ORDER1.LF]
    open_questions: ["needs-SME / room: target behaviour for a not-found order id on print (legacy: unhandled exception) - one answer with ORD202 option 5.", "Runtime-confirmable: exception surface, reply options, fate of the empty spooled file, module re-initialisation after abnormal end."]
