  - id: ord-entry-ord101-c12
    name: Closed-order guard lives in the callers (absence here)
    status: documented
    confidence: observed-in-code
    summary: "ORD101 loads ORDATCLO / ORDATDEL into the buffer and never tests them: closed or delivered orders are fully editable once inside. Guard only in ORD201 s01chk ((opt01 = 2 or 4) and datclo > 1940-01-01) and, broken, in ORD200 (c09). Direct CALL has no guard. Editing lines of a closed order leaves ORDATCLO set (no reopen). In-flight close from another job is serialised by the ORDER record lock (c02), not by a rule."
    entrypoints:
