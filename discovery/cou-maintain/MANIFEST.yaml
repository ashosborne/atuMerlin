  - id: cou-maintain-c09
    name: SltCountry selection window (keyed read, by code or by name)
    status: documented
    confidence: observed-in-code
    summary: "COU301 nomain, window COU301D 'Select a Country Code' (WINDOW(4 25 18 42)). Native keyed read - not SQL (contrast SltCustomer): SETLL pcod on COUNTRY (by code) or SETLL keydes on COUNTR1 (by name, RENAME REC52), one-row look-ahead saved in SAVCOD/SAVDES, 20 rows per load into SFLSIZ 11 / SFLPAG 10 (two pages per load; PAGEDOWN active under N80; RRB01 = LRRN keeps the cursor page). Option 1 on exactly one row returns that row's COID (the SFL01 field shares storage with the file field); F3 / F12 return pcod unchanged; plain Enter redisplays. No filter, no search field, no not-found message: pcod or position-to beyond the last key gives the frame with no rows (sfldsp = rrs01 > 0). pcod is passed by reference (prototype without VALUE - unlike SltCustomer) and never written. Both callers (CUS200 / PRO200 F4 on the edit panel) assign the result back to their code field and refresh the name without validation (cus-interactive-c05). Files and display file are opened once per activation group and never closed. Pointer: modern/src/shared/fcountry/index.ts listCountries() is a flat list by code, not a positioned keyed read - not changed."
