  - id: cou-maintain-c11
    name: Position-to option 8, guards 41/42 and row rules 35/36
    status: documented
    confidence: observed-in-code
    summary: "S01chk per changed row: OPT01 in {0,1} else 35 INVALID OPTION + RI (34) with the page set to the first offending row (ERR01 latch); a second 1 -> 36 ONLY ONE SELECTION. Control line after the loop, in order: OPTC1 not in {0,8} -> 41 Invalid option; SLT01 and OPTC1 <> 0 -> 42 Position to not available with selection pending; STS01 and IN08 -> redisplay (F8 ignored). S01act: OPTC1 = 8 -> KEYCOD = POSCOD (by code) or KEYDES = POSDES (by name, the only CHECK(LC) input), prp clears the control line and SETLLs. Invalid row + option 8: position not applied and the 8 stays typed; valid 1 + option 8: 42, nothing returned. SFLNXTCHG is set on every read row so blanked rows keep coming back through readc (harmless). Message texts are DDS literals, not SAMMSGF. Confirmed by diff: S01chk (166-220) and the position-to branch (233-239) are byte-identical to FAM301 sltArtFam; FAM301D differs from COU301D only in %TEXT, REFFLDs, titles and WINDOW geometry."
