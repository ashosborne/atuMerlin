  - id: cou-maintain-c07
    name: GetCountryName / GetCountryIso3 / ExistCountry (cached keyed chain)
    status: documented
    confidence: observed-in-code
    summary: "COU300 nomain: three exports over one private chainCOUNTRY. Open guard on a USROPN COUNTRY (opened by the first getter, never closed - c08). Cache test is P_COID <> COID against the record buffer's own field: a hit is cached (no I/O, stale until a different code is asked for), a miss clears the buffer first (blanks, %found off, so a miss is never cached), a blank code never reads (buffer COID blank at start and after every miss) and ExistCountry(blank) as the first call returns *off from the initial %found - correct by construction. Getters return the buffer field (COUNTR 30A / COISO 3A), ExistCountry = %found(country). COUNTRY has no delete flag, so exists = row present; no IsCountryDeleted analogue to FAM300. Callers: CUS200 / PRO200 (name on entry, name after F4, ExistCountry in the check -> ERR0002), CUS250 / PRO250 (name only). Pointer: modern/src/shared/fcountry/index.ts is the converted CUS dependency surface for these two getters (per-call query, no cache) - not changed."
