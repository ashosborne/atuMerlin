    status: documented
    confidence: observed-in-code
    summary: "S01CHK: *IN33 (SFLNXTCHG) on, UPDAT SFL01 for every READC row, 33 off after the loop; STEP01 = ACT. S01ACT reads one changed row per pass: OPT01 = 2 -> PANEL 2, STEP02 PRP, OPT01 = 0, UPDAT SFL01 under 33 off (row un-flagged and option cleared, with the PRE-edit COUNTR / COISO still in the shared fields); after panel 2 (UPDAT FCOUN or F12) PANEL = 1 with STEP01 still ACT -> READC yields the next 2, whose values overwrite the just-edited ones; 99 -> DSP. No UPDAT SFL01 ever follows the edit, so every edited row shows old data until F3 / F12 + fresh call; choosing 2 on it again shows the new values on FMT02 (CHAIN re-reads). Rows edited in RRN (= COID) order regardless of typing order. Invalid option + valid 2s on one Enter: 2s flagged but deferred to the next Enter (nothing lost, nothing early). A typed 0 passes CHK, is skipped by ACT without UPDAT, so its 33-flag persists and it is READC'd on every later Enter - harmless (same shape as c11's blanked rows in COU301). STEP02 left at KEY after a cancel - harmless, S01ACT sets PRP."
