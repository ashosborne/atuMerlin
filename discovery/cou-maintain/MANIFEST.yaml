    status: documented
    confidence: observed-in-code
    summary: "GetCountryIso3 is compiled, exported (FCOUNTRY.BND:6) and prototyped but no ATU_SRC member calls it; COISO (literal 3A in COUNTRY.PF, not a SAMREF field) is otherwise read/written only by the deferred COU200 FMT02, and CUSTOMER / PROVIDER store the 2A COID only. closeCOUNTRY is implemented and prototyped (copybook publishes five prototypes for four exports - same drift as FVAT) but absent from FCOUNTRY.BND, so with EXPORT(*SRCFILE) no caller can bind to it; a CloseCOUNTRY() call would compile and fail at bind. Nothing inside the module calls it either, so COU300's COUNTRY ODP - and COU301's separate COUNTRY / COUNTR1 / COU301D opens - live until the activation group ends (ACTGRP(*CALLER))."
