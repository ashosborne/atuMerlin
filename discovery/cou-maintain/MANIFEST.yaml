  - id: cou-maintain-c10
    name: F8 toggle clears the key of the mode entered (source differs from FAM301; observable behaviour identical)
    status: documented
    confidence: observed-in-code
    summary: "F8 -> S01chk first (ignored if any row option was typed: STS01 and IN08 -> dsp), then S01act: bydesc = not bydesc; if bydesc clear KEYDES else clear KEYCOD; prp repositions with the blank key. FAM301 clears the opposite key (the mode left). Correction to Phase A ('opposite of FAM301', 'template divergence'): traced through both modules, the retained key in COU301 is never read while the other order is active and is cleared again on re-entry, so both windows show the new order from the top on every toggle and both lose the caller's pcod position after the first toggle away and back. Divergence is real in source, nil on the screen. IN08 is tested before OPTC1 = 8, so F8 + position-to on one Enter toggles and discards the position; F8 + invalid control option never reaches the toggle (41 fires first)."
