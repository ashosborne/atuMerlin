    confidence: observed-in-code
    summary: "Guard '(opt01 = 2 or opt01 = 4) and datclo > datBlank' (parentheses present; ORD200:187 lacks them) refuses 2 only on a closed order (SFLMSG 36); open order -> ORD101(orid) by reference, synchronous; opt cleared, row rewritten, no reload -> SUMORD (Value) stale after line edits until F5/F6. Only working path to ORD101 in the estate. Guard reads the screen copy of datclo (order closed by another job after the load still opens); delivered-not-closed orders editable (ORD101 has no test). Ghost row (orid 0 after 4) passes -> ORD101(0), callee chain misses silently. ORD201 holds no ORDER1 lock at call time."
