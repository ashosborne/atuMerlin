    entrypoints:
      - kind: screen
        locator: ORD201 s01chk / s01act
        evidence: ["ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:166-222", "ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:224-282", "ATU_SRC/QDDSSRC/ORD201D.DSPF:11-17", "ATU_SRC/QDDSSRC/ORD201D.DSPF:44-49", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:168"]
