    status: documented
    confidence: observed-in-code
    summary: "pnl00 (panel 0 after F3/F12) runs 'exec sql close c1' then *inlr = *on - needed because ORD201 pages and the cursor is normally still open on exit; ORD200 closes in s01lod after loading everything and its pnl00 has no close. Every normal exit path closes (F5/F6 before reload, F3/F12 in pnl00). *inzsr only presets the three dates to 1940-01-01 (no parameter, no header chain). Inferred: an abnormal end (ghost-row 7/8, lock time-out) leaves c1 open in the activation group; the next call in the same job gets -502 on open and shows an empty list with no message - runtime-confirmable, depends on CLOSQLCSR/ACTGRP."
