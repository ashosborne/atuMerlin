needs_sme:
  - "c07: option 3 passes validation and has no action (ORD200 rejects it) and stays typed for ever — was it meant to be something? One rule for the target?"
  - "c07: options typed before PAGEDOWN survive and execute on the next Enter (possibly pages later); one refused row cancels every action on the pass. Known to users? Keep?"
  - "c03 / c04 (with ord-maintain-ord200-c09 / c13): ORD201 is the only working path to ORD101 (correct closed guard) and deletes lines-first with the row blanked; ORD200's 2 is dead and it deletes header-first leaving the row as loaded. Which twin is the parity reference for the target list?"
  - "c04: no confirmation before delete; a header lock (open ORD101 session) fails the header delete after the lines are gone -> header with no lines. Carry forward?"
  - "c01: 'all orders' = all orders with a CUSTOMER row (ORDERCUS inner join, planted defect as-is). Intended definition for the target list?"
  - "c01 (inferred from DB2 for i NULL ordering): one order with an invalid ORDATE anywhere in the estate sorts first, the first fetch fails -305, and the whole list is empty with no message. Known? Confirm on the box."
  - "c06 (pointer to ord-maintain-ord200-c06/c07/c08): close-vs-deliver semantics, partial lines skipped, 'Invalid Option' text for state refusals, stale screen-copy guards - one answer covers both twins. Sharpening recorded here: ORD700U is TRGUPDCND(*CHANGE), so an unchanged zero-quantity line rewritten by 8 does not invoke the trigger."
  - "c09 / c11: activation group inferred QILE (no ACTGRP) and CLOSQLCSR default - build owner to confirm; c11 inference: an abnormal end leaves c1 open and the next call in the same job shows an empty list (-502)."
  - "c09: SAMMNU option 3 help= points at cus200; both list screens carry the panel id 'ORD200-1'. Cosmetic; recorded (menu-cmd-shell owns the help map)."
  - "c01: page is 7 two-line rows (SFLPAG 7), 14 rows per fetch batch; F11 (SFLDROP) drops the customer line and is invisible to the program. Phase A's '14 rows per page' corrected. Truncated-form page size runtime-confirmable."

features:
  - id: ord-maintain-ord201-c01
    name: List all orders paged from ORDERCUS
    status: documented
    confidence: observed-in-code
    summary: "SQL cursor over ORDERCUS with no WHERE (inner join -> only orders with a CUSTOMER row), ISOTODATE40 on the three dates, TOTVAL (VAT-inclusive), orcuid/custnm per row; ORDER BY datord DESC, orid DESC (tie-breaker present). 14 rows per fetch batch, cursor kept open, PAGEDOWN (N80) fetches the next batch; the screen page is 7 two-line rows (SFLPAG 7, customer on line 2) - Phase A's '14 per page' is the batch. sflend on any non-zero SQLCOD (incl. -305 on a NULL date) -> silent truncation; inferred: a NULL ORDATE sorts first in DESC and empties the whole list. F11 SFLDROP handled by the display. rrs01 preserves the RRN high-water mark across READC. Dead declarations mode/User/crt/upd/help/prompt/morekeys. Panel id literal 'ORD200-1'."
    entrypoints:
      - kind: screen
        locator: ORD201 CTL01/SFL01 (s01prp / s01lod / s01dsp)
        evidence: ["ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:93-142", "ATU_SRC/QSQLSRC/ORDERCUS.VIEW:5-21", "ATU_SRC/QDDSSRC/ORD201D.DSPF:12-49"]
    behaviour_doc: features/ord-maintain-ord201-c01.md
    dependencies: [ORDERCUS.VIEW, ISOTODATE4.SQLUDF, DAT002.PGM.RPGLE]
    open_questions: ["needs-SME: inner-join view as the definition of 'all orders' for the target?", "needs-SME (inferred): NULL ORDATE sorts first -> empty list; confirm on the box."]
