needs_sme:
  - "c01 / c04: a not-found order id (the ghost row both list twins can pass after a delete, or a concurrent delete) raises an unmonitored date exception at the unguarded %date(ordate:*iso) - nothing is displayed; ORD500 has the same conversion. What does the target's display-order do for an id that no longer exists? (Room decision for the ORD pack.)"
  - "c02 / c05: the article description line is hidden until F11 (SFLDROP - truncated first, 12 records per page; folded 6). Intended presentation or template accident? Should the target show it by default?"
  - "c02 / c06: a missing article repeats the previous line's description (bare chain, buffer not cleared); FARTICLE.GetArtDesc (ORD100/ORD101) returns blank for the same miss. One lookup rule for the target - blank, 'unknown', or error? Recorded as-is, not fixed."
  - "c02: TOT / TOTVAT are sums of the STORED ODTOT / ODTOTVAT (incl. ODTOTVAT re-rated by a plain Enter in ORD101), never recomputed; agrees with the lists' TOTVAL only while the lines are unchanged. Carry forward as stored sums?"
  - "c03 / c05: every key that reaches the program ends it - Enter, F5 (enabled, 'Refresh' description, not in the legend) and F6 ('Create') included. Keep 'any key closes' in the target, or offer refresh / drop F5-F6?"
  - "c01: dates shown dd/mm/yy (DATFMT *DMY) with MAPVAL '01/01/40' -> blank for delivery/close; the list twins use *JOB and '1940-01-01'. Bind date lock (NULL in Postgres, sentinel at the boundary) gives the same blank observable; ORDATE has no sentinel path here. Confirm one date presentation for the ORD screens."
  - "c01 / c03 / c04 / c06: activation group inferred QILE (no ACTGRP); build definition not in the tree (CRTPGM binding cannot be excluded) - build owner to confirm. Exception surface (status 00112 -> RNQ0112 inquiry in the caller's session) is an ILE inference, runtime-confirmable."
  - "c05: Phase A's 'orders with more than 7 lines may not display fully' is withdrawn - SFLSIZ 7 != SFLPAG 6 auto-extends the subfile and the display pages it (no PAGEDOWN keyword); page counts, More.../Bottom and the roll-past-Bottom message are DDS-contract statements, runtime-confirmable on the box."

features:
  - id: ord-maintain-ord202-c01
    name: Order header display with sentinel dates
    status: documented
    confidence: observed-in-code
    summary: "chain id order1 then chain orcuid custome1, neither %found tested; datord = %date(ordate:*iso) unconditional, datliv/datclo converted only when > 0 else left at the *inzsr preset 1940-01-01 (implicit sentinel, relies on *inlr every call); DSPF *DMY shows 01/01/40 which MAPVAL blanks on DATLIV/DATCLO, DATORD has no MAPVAL. Not-found id (ghost row after a delete in ORD200/ORD201, or concurrent delete) -> ORDATE 0 -> %date(0) -> unmonitored status 00112, no screen (ORD500 identical). Zero/invalid stored ORDATE, or non-zero invalid ORDATDEL/ORDATCLO, fail the same way (guard is a zero test); no in-tree writer stores ORDATE 0. Missing customer -> blank customer line, no message (orphans unreachable via the lists). Two-digit years; the three ORD screens do not share a date presentation. No writes (four 'if' files). Dead declarations User/count/mode/crt/upd/chk/rrs01/err01 and nine indicators; panel id 'ORD202-1' (own)."
    entrypoints:
      - kind: screen
        locator: ORD202 CTL01 header (s01prp / *inzsr)
        evidence: ["ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:82-96", "ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:147-151", "ATU_SRC/QDDSSRC/ORD202D.DSPF:50-60"]
    behaviour_doc: features/ord-maintain-ord202-c01.md
    dependencies: [ORDER1.LF, CUSTOME1.LF]
    open_questions: ["needs-SME / room: target behaviour for a not-found order id (legacy: unmonitored exception).", "Build owner: activation group (inferred QILE)."]
  - id: ord-maintain-ord202-c02
    name: Order lines display with totals
    status: documented
    confidence: observed-in-code
    summary: "setll/reade DETORD1 by ODORID (ascending ODLINE), every line in one pass; chain odarid article1 per line (no %found -> a missing article repeats the previous line's ARDESC); tot += odtot, totvat += odtotvat (stored sums, never recomputed); write sfl01; sflend on unconditionally. Two-line SFL01 record (row 8 line/article/qty/delivered/price/total/with-VAT, row 9 ARDESC 50 full width); SFLDROP(CF11) -> shown truncated first (12 per page), F11 folds (6 per page, SFLPAG); SFLSIZ 7 != SFLPAG 6 -> auto-extend, display-side paging, More.../Bottom. Totals on the footer KEY01 (written before exfmt ctl01), EDTCDE(2) shows zero as blank (undelivered lines have an empty Deliver column). Empty order: header + headings + blank totals, no message. RRb01 = LRRN after exfmt is dead (program exits). SFLNXTCHG/SFLMSG residue never set."
    entrypoints:
      - kind: screen
        locator: ORD202 SFL01 / KEY01 (s01lod / s01dsp)
        evidence: ["ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:99-127", "ATU_SRC/QDDSSRC/ORD202D.DSPF:12-41", "ATU_SRC/QDDSSRC/ORD202D.DSPF:78-91"]
    behaviour_doc: features/ord-maintain-ord202-c02.md
    dependencies: [DETORD1.LF, ARTICLE1.LF]
    open_questions: ["needs-SME: description hidden until F11 - intended?", "needs-SME: repeated-description-on-miss recorded as-is; target lookup rule?", "needs-SME: footer = stored sums, carry forward?"]
  - id: ord-maintain-ord202-c03
    name: Read-only exit on any key
    status: documented
    confidence: observed-in-code
    summary: "One exfmt per call. s01key: exit (F3) and cancel (F12) -> panel 0; other (Enter, F5, F6, anything else that returns) -> s01act -> panel 0; next cycle pnl00 -> *inlr. No redisplay, refresh, option processing or message; id never modified; no return value. F3 = F12 (one panel). Keys that do not return: F11 (SFLDROP), Page Up/Down inside the loaded subfile, Print. Fresh state every call (*inzsr presets, inz(1)/inz(prp), file opens) - the c01 implicit sentinel depends on it. Callers clear the option and rewrite the row, no reload (ord-maintain-ord200-c05 / ord-maintain-ord201-c05)."
    entrypoints:
      - kind: screen
        locator: ORD202 s01key / s01act / pnl00
        evidence: ["ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:129-144", "ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:153-155", "ATU_SRC/QDDSSRC/ORD202D.DSPF:8-10"]
    behaviour_doc: features/ord-maintain-ord202-c03.md
    dependencies: []
    open_questions: ["needs-SME: keep 'any key closes' (incl. Enter/F5/F6) or offer refresh in the target?"]
  - id: ord-maintain-ord202-c04
    name: Callers ORD200 / ORD201 option 5
    status: documented
    confidence: observed-in-code
    summary: "Exactly two call sites under ATU_SRC: ORD200 s01act opt 5 and ORD201 s01act opt 5, prototype dspord extpgm('ORD202') with one like(orid) parameter by reference, synchronous; then opt01 = 0, update sfl01, no reload. No menu, CMD, CL or other caller (contrast ORD500C). Option 5 has no state or existence guard in either twin: closed/delivered orders display normally; a ghost row (ORD201 blanks to orid 0, ORD200 leaves the deleted id) or a concurrent delete -> the c01 exception fires inside ORD202 in the list program's session (inquiry message; cancel unwinds through the caller - ILE inference). Parameter unchanged by the callee. Legend '5=Display' on both list screens."
    entrypoints:
      - kind: other
        locator: extpgm ORD202 from ORD200 / ORD201
        evidence: ["ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:24-25", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:236-239", "ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:21-22", "ATU_SRC/QRPGLESRC/ORD201.PGM.SQLRPGLE:242-245", "ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:16-19"]
    behaviour_doc: features/ord-maintain-ord202-c04.md
    dependencies: [ORD200.PGM.SQLRPGLE, ORD201.PGM.SQLRPGLE]
    open_questions: ["needs-SME / room: explicit not-found answer for the ghost-row and concurrent-delete cases in the target."]
  - id: ord-maintain-ord202-c05
    name: Dead keys and display-side paging
    status: documented
    confidence: observed-in-code
    summary: "ORD202D is the list template minus input: CF06 'Create' and CA05 'Refresh' enabled, indicators create/refresh declared and never tested -> both exit (c03); neither in the KEY01 legend (F3=Exit, F11=Detail, F12=Cancel). NO option column - every SFL01/CTL01 field is output-only (Phase A 'option field unused' corrected: none exists); SFLNXTCHG, SFLMSG('Invalid Option'), ERRSFL, SFLRCDNBR copy are residue never exercised. Paging is NOT missing: SFLSIZ 7 != SFLPAG 6 auto-extends the subfile, the display handles Page Up/Down (no PAGEDOWN/ROLLUP keyword; pagedown indicator never tested) and permits SFLDROP; sflend always on -> SFLEND(*MORE) More.../Bottom. Orders with more than 7 lines display fully (Phase A concern withdrawn); roll past Bottom -> system message. PRINT key live. Same 15/14 idiom in ORD101D/ORD200D; ORD201D pages in the program because it fetches in batches."
    entrypoints:
      - kind: screen
        locator: ORD202D CTL01 keywords / indds
        evidence: ["ATU_SRC/QDDSSRC/ORD202D.DSPF:6-11", "ATU_SRC/QDDSSRC/ORD202D.DSPF:29-42", "ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:20-35", "ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:129-140"]
    behaviour_doc: features/ord-maintain-ord202-c05.md
    dependencies: []
    open_questions: ["needs-SME: keep F5/F6 as 'close' or drop them; description visible by default?", "Runtime-confirmable: page counts (12 truncated / 6 folded), More.../Bottom, roll-past-Bottom message - DDS contract, not source."]
  - id: ord-maintain-ord202-c06
    name: Direct ARTICLE1 access bypasses FARTICLE
    status: documented
    confidence: observed-in-code
    summary: "farticle1 if e k disk + chain odarid article1 per line (no %found, no clear) where ORD100:117,266 / ORD101:114,223 call FARTICLE.GetArtDesc. Miss semantics differ: FARTICLE.chainARTICLE1 does clear *all FARTI before the chain -> blank; ORD202 leaves the buffer -> previous line's description repeated. Freshness differs: ORD202 opens/closes ARTICLE1 every call (*inlr) vs FARTICLE's lazy-open last-key cache per activation group. ARDESC shown at full 50 (ORD101D truncates to 30). ARDEL not tested. bnddir('SAMPLE') on the H spec is inert - no /COPY, no prototype, no bound call: ORD202 has no service-program dependency, only the four LFs (+PFs) and ORD202D on *LIBL. Customer lookup (chain custome1, c01) bypasses FCUSTOMER.GetCusName the same way (ORD100:328 / ORD101:283 use it; ORD200 chains too). Dependency fact for the ORD pack; no redesign here."
    entrypoints:
      - kind: other
        locator: ORD202 F-spec ARTICLE1 / chain odarid article1
        evidence: ["ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:5-11", "ATU_SRC/QRPGLESRC/ORD202.PGM.RPGLE:108", "ATU_SRC/QRPGLESRC/ART300.RPGLE:19-27", "ATU_SRC/QRPGLESRC/ART300.RPGLE:114-127"]
    behaviour_doc: features/ord-maintain-ord202-c06.md
    dependencies: [ARTICLE1.LF]
    open_questions: ["needs-SME / room: one article/customer lookup rule for the target (legacy: FARTICLE blank vs ORD202 stale carry-over).", "Build owner: CRTPGM binding not in tree."]
