needs_sme:
  - "c01 (inferred): are the three ADDPFTRG definitions and ORD701 actually attached on the reference box (DSPFD DETORD / ORDER)? Source defines; attachment is runtime state."
  - "c08 (inferred): no update/delete trigger on ORDER; CULASTORD stays stale after out-of-tree deletes or ORD901 date shifts until ART801/ORD901 recompute. Accepted drift or defect?"
  - "c11 (inferred): ORD700 never sees an order close (ORD200/201 opt 7 touches ORDER only) while ART801 excludes closed orders; ORD700 insert adds ODQTY where every other path uses ODQTY - ODQTYLIV. Verify with data before this becomes a card."
  - "c03: is the SAMLOG deletion log (menu opt 84, ADSPUSRSPC not in tree) an observable a target must preserve? Only the delete event logs; the message carries ODQTY, not the outstanding quantity subtracted."
  - "c03/c06: how is AddLogEntry bound into ORD700? H-spec has no bnddir, LOG is not in SAMPLE.BNDDIR, no ORD700.ILEPGM in QILESRC. Build owner / ARCAD."
  - "c05: silent no-op when the article is unknown or the delta is 0; ARCUSQTY can go negative; no error handling on chain/update inside the trigger. Acceptable as-is?"
  - "c07: ORD701 assigns the inserted ORDATE unconditionally (not MAX) — back-dated inserts move CULASTORD backwards. Only reachable from outside ORD100 today."
  - "c10: ART801 leaves articles with no open lines and customers with no open orders untouched (WHERE EXISTS) despite the menu label 'Reset'. Intended?"

