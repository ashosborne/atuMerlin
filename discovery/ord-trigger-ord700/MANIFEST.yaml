  - id: ord-trigger-ord700-c09
    name: Staging copy excludes triggers
    status: documented
    confidence: observed-in-code
    summary: "ORD100C / ORD100C2: CRTDUPOBJ DETORD -> QTEMP CST(*NO) TRG(*NO) + OVRDBF TMPDETORD; all staging add/edit/delete in ORD100 hits the untriggered copy. Real DETORD is opened output-only in ORD100, so only the confirm-time write fdeto fires ORD700 (insert, once per line, ODQTYLIV = 0, after ORDER header -> ORD701). Abandoned orders leave no trigger footprint."
    entrypoints:
      - kind: job
        locator: ORD100C / ORD100C2 CRTDUPOBJ TRG(*NO)
        evidence: ["ATU_SRC/QCLSRC/ORD100C.PGM.CLLE:6-12", "ATU_SRC/QCLSRC/ORD100C2.PGM.CLLE:5-11", "ATU_SRC/QRPGLESRC/ORD100.PGM.RPGLE:10-12", "ATU_SRC/QRPGLESRC/ORD100.PGM.RPGLE:197-208"]
    behaviour_doc: features/ord-trigger-ord700-c09.md
    dependencies: [DETORD.PF, ord-entry-ord100 (c02/c07 boundary)]
    open_questions: []
  - id: ord-trigger-ord700-c10
    name: ART801 batch reconciliation (related surface)
    status: documented
    confidence: observed-in-code
    summary: "SQL procedure UPDATE_ON_CUS_ORD_QTY (SPECIFIC ART801, COMMIT *NONE, menu opt 82 'Reset Summary Fields'): ARCUSQTY = SUM(ODQTY - ODQTYLIV) over open orders (ORDATCLO = 0); CUCREDIT = SUM(ODTOTVAT) over open orders (no incremental maintainer exists); CULASTORD = MAX(ORDATE) over all orders (same statement as ORD901). Each UPDATE guarded by WHERE EXISTS, so rows with no qualifying orders are left untouched, not reset. Plain SQL UPDATEs - ORD700/ORD701 do not fire."
    entrypoints:
      - kind: job
        locator: ART801 UPDATE_ON_CUS_ORD_QTY (menu opt 82)
        evidence: ["ATU_SRC/QSQLSRC/ART801.SQLPRC:4-38", "ATU_SRC/QPNLSRC/SAMMNU.MENU:151-154", "ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:46-50"]
    behaviour_doc: features/ord-trigger-ord700-c10.md
    dependencies: [ORDER.PF, DETORD.PF, ARTICLE.PF, CUSTOMER.PF]
    open_questions: ["Owned by sql-objects seed; listed here for the relationship.", "needs-SME: 'Reset' leaves rows without qualifying orders untouched - intended?"]
