    confidence: inferred
    summary: "Three ADDPFTRG (*AFTER insert/delete/update-on-change) calling ORD700 with RPLTRG(*YES), named ORD700_DETORD_ARTICLE_{INSERT,DELETE,UPDATE}; plus ORD701 CREATE TRIGGER on ORDER. Definitions observed; attachment on the box inferred. No card (bind: keep inferred labelled inferred)."
    entrypoints:
      - kind: other
        locator: DETORD triggers ORD700_DETORD_ARTICLE_*
        evidence: ["ATU_SRC/QTRGSRC/ORD700A.SYSTRG:4-7", "ATU_SRC/QTRGSRC/ORD700D.SYSTRG:4-7", "ATU_SRC/QTRGSRC/ORD700U.SYSTRG:4-8", "ATU_SRC/QSQLSRC/ORD701.SQLTRG:5-10"]
    dependencies: [DETORD.PF, ORDER.PF]
    open_questions: ["needs-SME: confirm attachment with DSPFD on the reference box."]
  - id: ord-trigger-ord700-c02
    name: Insert adds ordered quantity to article customer-order quantity
    status: documented
    confidence: observed-in-code
    summary: "teven='1': UpdArt(new.ODQTY, new.ODARID) -> ARCUSQTY += full ODQTY; new.ODQTYLIV is ignored on insert (every other path uses ODQTY - ODQTYLIV). Only in-tree inserter is ORD100 write fdeto at confirm (ODQTYLIV = 0), once per line, after the ORDER header. No sign/existence checks; missing article is a silent no-op."
    entrypoints:
      - kind: other
        locator: ORD700 teven='1'
        evidence: ["ATU_SRC/QRPGLESRC/ORD700.PGM.RPGLE:73-75", "ATU_SRC/QRPGLESRC/ORD700.PGM.RPGLE:97-110", "ATU_SRC/QTRGSRC/ORD700A.SYSTRG:4-7", "ATU_SRC/QRPGLESRC/ORD100.PGM.RPGLE:206"]
    behaviour_doc: features/ord-trigger-ord700-c02.md
    dependencies: [ARTICLE1.LF, DETORD.PF]
    open_questions: ["needs-SME (c11): is ARCUSQTY 'ordered' (insert path) or 'outstanding' (delete/update/ART801 paths)?"]
  - id: ord-trigger-ord700-c03
    name: Delete subtracts outstanding quantity and logs
    status: documented
    confidence: observed-in-code
    summary: "teven='2': callp(e) AddLogEntry('ORD700:Order Line deleted <ODORID> <ODLINE> article : <ODARID> quantity : <ODQTY>') to SAMLOG user space (User/Date/Msg line appended by LOG300; failure swallowed, %error unread), then UpdArt(-(ODQTY - ODQTYLIV), old.ODARID). Delete is the only logging event. Only in-tree deleter is ORD101 opt 4, which refuses lines with ODQTYLIV > 0. LOG binding not in source."
    entrypoints:
      - kind: other
        locator: ORD700 teven='2'
        evidence: ["ATU_SRC/QRPGLESRC/ORD700.PGM.RPGLE:76-82", "ATU_SRC/QRPGLESRC/LOG300.RPGLE:18-35", "ATU_SRC/QTRGSRC/ORD700D.SYSTRG:4-7", "ATU_SRC/QRPGLESRC/ORD101.PGM.RPGLE:191"]
    behaviour_doc: features/ord-trigger-ord700-c03.md
    dependencies: [ARTICLE1.LF, LOG.ILESRVPGM, LOG.RPGLEINC, SAMLOG (*USRSPC, not in tree)]
    open_questions: ["needs-SME: is the SAMLOG user-space log an observable a target must preserve?", "needs-SME (build): how is AddLogEntry bound into ORD700 (no bnddir in H-spec; LOG not in SAMPLE.BNDDIR)?"]
  - id: ord-trigger-ord700-c04
    name: Update applies outstanding-quantity delta, handles article change
    status: documented
    confidence: observed-in-code
    summary: "teven='3' (TRGUPDCND(*CHANGE)): same article -> UpdArt((dODQTY) - (dODQTYLIV)); article changed -> add new outstanding to new article, subtract old outstanding from old article. In-tree firers: ORD101 line edit (qty/delivered/price; price-only nets 0), ORD200/201 opt 8 deliver (ODQTYLIV = ODQTY -> -ODQTY per undelivered line), ORD901 ODYEAR backfill (nets 0). No in-tree writer changes ODARID. Order close (opt 7) touches ORDER only -> not seen here."
    entrypoints:
      - kind: other
        locator: ORD700 teven='3'
        evidence: ["ATU_SRC/QRPGLESRC/ORD700.PGM.RPGLE:83-93", "ATU_SRC/QTRGSRC/ORD700U.SYSTRG:4-8", "ATU_SRC/QRPGLESRC/ORD101.PGM.RPGLE:267-270", "ATU_SRC/QRPGLESRC/ORD200.PGM.SQLRPGLE:259-270", "ATU_SRC/QRPGLESRC/ORD901.PGM.SQLRPGLE:42-45"]
    behaviour_doc: features/ord-trigger-ord700-c04.md
    dependencies: [ARTICLE1.LF, DETORD1.LF]
    open_questions: ["needs-SME (c11): ARCUSQTY is not reduced when an order is closed without delivery."]
  - id: ord-trigger-ord700-c05
    name: Silent no-op on zero delta or unknown article
    status: documented
    confidence: observed-in-code
    summary: "UpdArt: qty = 0 -> return; chain ARTICLE1 by id, not %found -> return; else ARCUSQTY += qty; update FARTI (ARMOD/ARMODID not stamped, ARDEL ignored). No error, message or log on skip; no (e) extender on chain/update so lock/I-O errors are unhandled inside the trigger; result may go negative; overflow past 99999 unguarded."
    entrypoints:
      - kind: other
        locator: ORD700 UpdArt
        evidence: ["ATU_SRC/QRPGLESRC/ORD700.PGM.RPGLE:97-110", "ATU_SRC/QDDSSRC/ARTICLE1.LF:4-6", "ATU_SRC/QDDSSRC/SAMREF.PF:47"]
    behaviour_doc: features/ord-trigger-ord700-c05.md
    dependencies: [ARTICLE1.LF]
    open_questions: ["needs-SME: are silent skips (unknown article) and negative ARCUSQTY acceptable as-is?"]
  - id: ord-trigger-ord700-c06
    name: Trigger buffer mechanics
    status: documented
    confidence: observed-in-code
    summary: "*ENTRY PARM1 (80-byte trigger buffer header: FNAME/LNAME/MNAME/TEVEN/TTIME/CMTLCK/CCSID/offsets+lengths) + PARM2 length; NEW/OLD are EXTNAME(detord) based DS set from NEWOFF/OLDOFF. %parms = 0 -> seton lr + return; otherwise select on TEVEN (no other branch) and return with LR off (program and ARTICLE1 stay active). TTIME, CMTLCK, null maps, lengths and PARM2 never read. dftactgrp(*no) with no actgrp keyword (compile-time)."
    entrypoints:
      - kind: other
        locator: ORD700 *ENTRY
        evidence: ["ATU_SRC/QRPGLESRC/ORD700.PGM.RPGLE:14-61", "ATU_SRC/QRPGLESRC/ORD700.PGM.RPGLE:65-72", "ATU_SRC/QRPGLESRC/ORD700.PGM.RPGLE:94-95"]
    behaviour_doc: features/ord-trigger-ord700-c06.md
    dependencies: [DETORD.PF]
    open_questions: ["Bind note for a later station (not a behaviour): conversion must replace this mechanism, not port it.", "needs-SME (build): compile-time ACTGRP and bind directory for ORD700."]
  - id: ord-trigger-ord700-c07
    name: ORD701 sets customer last-order date on order insert
    status: documented
    confidence: observed-in-code
    summary: "SQL AFTER INSERT FOR EACH ROW trigger on ORDER (PROGRAM NAME ORD701, sqlPath *LIBL): UPDATE Customer SET culastord = n.ordate WHERE cuid = n.orcuid. Unconditional assignment (not MAX) - back-dated inserts move the date backwards; unknown customer -> 0 rows, silent; soft-deleted customer updated; CUMOD/CUMODID untouched. Only in-tree inserter is ORD100 write forde (today's date, before the lines). Insert only - no update/delete counterpart (c08)."
    entrypoints:
      - kind: other
        locator: ORDER trigger ORD701_Insert_order
        evidence: ["ATU_SRC/QSQLSRC/ORD701.SQLTRG:5-16", "ATU_SRC/QRPGLESRC/ORD100.PGM.RPGLE:189-197", "ATU_SRC/QDDSSRC/CUSTOMER.PF:21-22"]
    behaviour_doc: features/ord-trigger-ord700-c07.md
    dependencies: [ORDER.PF, CUSTOMER.PF]
    open_questions: ["needs-SME: is 'last order date' meant as most-recent (then unconditional assignment is a latent defect for back-dated inserts)?"]
  - id: ord-trigger-ord700-c08
    name: Trigger asymmetry leaves CULASTORD stale on delete
    status: needs-SME
    confidence: inferred
    summary: "No delete/update trigger on ORDER; ART801/ORD901 recompute later with MAX(ORDATE). No in-tree program deletes ORDER rows; ORD901 shifts ORDATE and then recomputes itself. No card (bind: keep inferred labelled inferred)."
