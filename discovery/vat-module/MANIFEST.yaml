  - id: vat-module-c06
    name: Rate cache stale for the activation group after a VATDEF change
    status: documented
    confidence: observed-in-code
    summary: "Same code requested twice never re-reads; a change to the buffered VATDEF row is invisible until a different code is requested and the original code asked for again. In an ORD100 session with one VAT code the first-read rate holds for every line of every order until the program ends. Misses do not stick (buffer blank), so newly added codes are seen. Reachable only via out-of-tree writes (no maintainer, c07)."
    entrypoints:
      - kind: other
        locator: VAT300 chainVATDEF
        evidence: ["ATU_SRC/QRPGLESRC/VAT300.RPGLE:66-73", "ATU_SRC/QILESRVSRC/FVAT.ILESRVPGM:8", "ATU_SRC/QRPGLESRC/ORD100.PGM.RPGLE:267-269"]
