feature_id_note: "Stable ids kept as cNN (Phase A / bind / APP_MANIFEST reference them); not renumbered to <SLICE_ID>-NNN. Same decision as runs 1-4."
needs_sme:
  - "c02: should an unknown VAT code be an error in the target rather than silent zero VAT? As-is: ODTOTVAT = ODTOT, rate shown .00, no message. The only entry point for a VAT code (ART200 FMT02 ARVATCD) does not validate it."
  - "c04: a soft-deleted VAT code (VATDEL = 'X') is still applied by ClcVAT/GetVATRate because ExistVATRate has no caller. Intended?"
  - "c06: do VAT rates change while jobs run? If so, the as-is system applies the old rate for the rest of the session in every activation group that already buffered that code."
  - "c07: how are VATDEF rows maintained on the box (DFU / STRSQL / restore)? Decides seed-configuration vs maintenance screen for the target - a room decision, not a card."
  - "c03: ART200 FMT02 carries VATRATE / VATDESC / WITHVAT output fields that the program never fills (blank on screen). Dead design or removed wiring? GetVATDesc has no caller anywhere."
  - "c09: signature 'V1' is a literal, no *PRV block; is it bumped and are callers recompiled when FVAT changes? Build owner."

features:
  - id: vat-module-c01
    name: ClcVAT arithmetic (net x rate / 100, half-adjust to 2 dp)
    status: documented
    confidence: observed-in-code
    summary: "ClcVAT(code, net) returns the VAT amount (not the gross): tot(11P 4) = (net * VATRATE) / 100 (truncated to 4 dp, no H), return %dech(tot : 9 : 2). Both parameters by value; net 9P 2, result 9P 2. Equivalent to half-adjusting the exact quotient to 2 dp. No overflow path (|tot| < 10^7). Callers add it to the net (ODTOTVAT = ODTOT + vat); DETORD stores ODTOT/ODTOTVAT only, never the code or rate."
    entrypoints:
      - kind: api
        locator: FVAT ClcVAT (VAT300)
        evidence: ["ATU_SRC/QRPGLESRC/VAT300.RPGLE:38-49", "ATU_SRC/QPROTOSRC/VAT.RPGLEINC:22-24", "ATU_SRC/QRPGLESRC/ORD100.PGM.RPGLE:267-268", "ATU_SRC/QDDSSRC/DETORD.PF:17-20"]
    behaviour_doc: features/vat-module-c01.md
    dependencies: [VATDEF.PF]
    open_questions: []
  - id: vat-module-c02
    name: Unknown VAT code -> rate 0 -> zero VAT silently
    status: documented
    confidence: observed-in-code
    summary: "chainVATDEF clears the buffer before the chain, so a miss leaves VATRATE 0 / VATDESC blank; ClcVAT and GetVATRate return 0, no message. No caller calls ExistVATRate first. Unknown codes enter via ART200 FMT02 ARVATCD (unvalidated, no F4 prompt; FAVATCD default never applied). Misses are re-read on every call (not cached) except a blank code, which never reads (c05). ORD100 stores ODTOTVAT = ODTOT, indistinguishable from a zero-rated line."
    entrypoints:
      - kind: api
        locator: FVAT chainVATDEF miss path
        evidence: ["ATU_SRC/QRPGLESRC/VAT300.RPGLE:61-74", "ATU_SRC/QRPGLESRC/ORD100.PGM.RPGLE:267-269", "ATU_SRC/QRPGLESRC/ART250.PGM.SQLRPGLE:154", "ATU_SRC/QRPGLESRC/ART200.PGM.SQLRPGLE:280-291", "ATU_SRC/QDDSSRC/ART200D.DSPF:111"]
    behaviour_doc: features/vat-module-c02.md
    dependencies: []
    open_questions: ["needs-SME: should a bad VAT code be an error in the target?"]
