  - id: vat-module-c04
    name: ExistVATRate respects the delete flag but has no caller
    status: documented
    confidence: observed-in-code
    summary: "Returns %found(VATDEF) and VATDEL <> 'X'; no caller in ATU_SRC. Consequence: ClcVAT/GetVATRate/GetVATDesc ignore VATDEL, so a soft-deleted rate is still applied. Only reader of VATDEL; no writer of VATDEL exists (c07). On the cached path %found reflects the previous I/O; before any I/O (blank first code) it is *off."
    entrypoints:
      - kind: api
        locator: FVAT ExistVATRate (VAT300)
        evidence: ["ATU_SRC/QRPGLESRC/VAT300.RPGLE:52-59", "ATU_SRC/QDDSSRC/VATDEF.PF:15", "ATU_SRC/QDDSSRC/SAMREF.PF:26"]
