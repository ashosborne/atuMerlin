  - id: vat-module-c08
    name: VAT code comes from the article via GetArtVatCode (two srvpgm hops)
    status: documented
    confidence: observed-in-code
    summary: "ORD100 and ORD101 call CLCVat(GetArtVatCode(odarid) : odtot) then GetVatRate(GetArtVatCode(odarid)) - two srvpgm hops, round trip twice per line prepare (both caches hit the second time). ART250 has already chained ARTICLE1 and passes ARVATCD directly (one hop) - correction to Phase A 'every caller'. FVAT never sees an article id; unknown article -> blank code -> zero VAT without reading VATDEF. ART250 shows the ClcVAT result (VAT amount) under a 'with VAT' label (pointer, art-interactive). DETORD never stores the code."
