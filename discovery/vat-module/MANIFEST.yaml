  - id: vat-module-c10
    name: Copybook / module parameter-type drift on CLCVat
    status: documented
    confidence: observed-in-code
    summary: "ClcVAT's code parameter is '1' (no A) and its return / net '9 2' (no P) in BOTH the copybook PR and the module PI - correction to Phase A (the module also omits the A). The other three exports write 1A / 4P 2. Untyped length-only resolves to character, length-with-decimals to packed, so PR and PI match and the effective contract is ClcVAT(char(1), decimal(9,2)) -> decimal(9,2). Cosmetic; no runtime effect."
    entrypoints:
