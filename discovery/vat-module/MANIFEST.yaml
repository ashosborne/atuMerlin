  - id: vat-module-c05
    name: Lazy open and last-key cache; closeVATDEF not exported
    status: documented
    confidence: observed-in-code
    summary: "VATDEF if e k disk usropn; chainVATDEF opens on first call (unmonitored) and reads only when P_VATCODE <> buffered VATCODE (clear *all FVAT then chain, unmonitored). Hits cached until another code is requested; non-blank misses re-read each call; a blank request code never reads (buffer starts/clears blank). closeVATDEF present but not exported and never called; copybook advertises CloseVATDEF (would fail to bind). File stays open for the caller's activation group (ACTGRP(*CALLER); callers are DFTACTGRP(*NO) with no ACTGRP keyword - compile-time)."
    entrypoints:
