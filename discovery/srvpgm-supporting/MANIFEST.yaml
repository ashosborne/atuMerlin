  - "c02 (source owner - Phase A Q1/Q2): who owns XML / XSS - ARCAD sample libraries or third-party? Can their source, or at least QPROTOSRC/XML + QPROTOSRC/XSS copybooks and one sample output file each, be added to the allowlist? PRO202 and PRO203 do not compile from this tree (member-style /copy of absent members) before any binding question. Are ORDER / TXT dead directory entries? DSPBNDDIR SAMPLE + DSPOBJD on the box answer both."
  - "c05 (build owner - Phase A Q3, inferred, carded): how do PRO203, ORD500, ORD700 resolve XSS / FPARAMETER / LOG with neither bnddir nor an .ILEPGM? Ask for the elias compile log or ARCAD object attributes, or DSPPGM <pgm> DETAIL(*SRVPGM). Note a build-level BNDDIR(SAMPLE) would bind PRO203 and ORD500 but NOT ORD700 (LOG is not in SAMPLE) - so (a) alone cannot be the answer."
  - "c07 (build owner / runtime-confirm - Phase A c07 corrected): the 14 ILE programs without an actgrp keyword take the compiler default, which is QILE (*STGMDL), not a new group per program. If so every getter cache is job-wide (all screens, until RCLACTGRP QILE / sign-off), not per calling program. One command settles it: DSPPGM ORD100 DETAIL(*BASIC) (any of the fourteen). Room: which staleness should the target reproduce - none (recommended, as every *-modules card says), per request, or per session?"
  - "c06 (build owner): were the five hand-fixed SIGNATURE('V1') export lists ever changed after their first build? Source cannot show it (no *PRV, no history). With a fixed signature the export ORDER is the binary contract - FFAMILLY.BND is in source order, the other four alphabetical. ME: the 57 exported names (51 in .BND + 5 FPARAMETER + 1 LOG) are the callable surface; derive the target module API from the imports (c03-c05), not from the copybooks (which advertise seven unexported Close* procedures and GetArtInfo) and not from 'every procedure in the module'."
  - "c06 / par-maintain-c10 (correction applied this run): EXPORT(*ALL) exports module exports only - PAR300 exports five (GetPARM1-5; chainPARAMETER / closePARAMETER have no export keyword), LOG300 exports one. par-maintain-c10 had read 'all seven procedures'; its card and MANIFEST summary carry a correction note. No code change implied."
  - "c03 (art-modules, held): ART250 imports GetArtInfo (ARTICLE.RPGLEINC:59, body ART302.SQLRPGLE:11) and no service program in the tree exports it (FARTICLE = ART300 + ART301 only). As the tree stands CRTBNDRPG ART250 fails on an unresolved import unless the build supplies ART302 some other way. This is the existing ART302 question (INDEX row 4); restated as a binding fact, not answered."
  - "c03 (room, ORD): ORD200 / ORD201 / ORD202 carry bnddir('SAMPLE') and import nothing bound - inert. Already reflected in the ORD conversion (ord-maintain-ord202 'bnddir inert'); no action, recorded so nobody adds a getter dependency to match the keyword."
  - "c01 (room / ME): the binding directory has no target counterpart; the dependency edges it encodes (c03, c08) are what the target's module layering should preserve or consciously flatten. Recommendation unchanged from Phase A: reject srvpgm-supporting as a conversion slice; carry c01/c03/c06/c07/c08 tables as architecture notes."
  - "c09 (build owner): the twelve build members are 2022-05-17 ARCAD snapshots of objects in FGRMON_OBJ; DSPOBJD on the box tells whether anything was rebuilt with different options since. iproj.json repository points at AdrianAtArcad/atuMerlin (provenance)."

