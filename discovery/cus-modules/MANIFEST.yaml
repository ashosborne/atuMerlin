features:
  - id: cus-modules-c01
    name: Customer getter family (GetCus*)
    status: documented
    confidence: observed-in-code
    summary: "Eleven exported nomain procedures each call chainCUSTOME1 by CUID (5P 0 by value) and return one CUSTOMER column from the module-global buffer; no found/not-found signal (unknown id -> blanks/0). Country returned as code. Export surface = 15 symbols, SIGNATURE('V1'). Only GetCusName has callers in ATU_SRC (ORD100, ORD101)."
    entrypoints:
      - kind: api
        locator: FCUSTOMER GetCusName..GetCusCredit
        evidence: ["ATU_SRC/QRPGLESRC/CUS300.RPGLE:19-137", "ATU_SRC/QPROTOSRC/CUSTOMER.RPGLEINC:7-63", "ATU_SRC/QSRVSRC/FCUSTOMER.BND:4-20", "ATU_SRC/QILESRVSRC/FCUSTOMER.ILESRVPGM:8-9"]
    behaviour_doc: features/cus-modules-c01.md
    dependencies: [CUSTOME1.LF, CUSTOMER.PF, SAMREF.PF, CUSTOMER.RPGLEINC, FCUSTOMER.BND, FCUSTOMER.ILESRVPGM, SAMPLE.BNDDIR]
    open_questions: ["needs-SME: are the getters other than GetCusName (and ExistCus/IsCusDeleted) called from anything outside ATU_SRC? None found in the tree."]
  - id: cus-modules-c02
    name: ExistCus (found and not deleted)
    status: documented
    confidence: observed-in-code
    summary: "Returns %found(CUSTOME1) and CUDEL <> 'X' after the cached chain; only uppercase X counts as deleted; unknown id -> false. No caller in ATU_SRC. ExistCus(0) as the very first FCUSTOMER call never chains, so %found has no prior operation (result not documented by IBM; unknown)."
    entrypoints:
      - kind: api
        locator: FCUSTOMER ExistCus
        evidence: ["ATU_SRC/QRPGLESRC/CUS300.RPGLE:152-160", "ATU_SRC/QPROTOSRC/CUSTOMER.RPGLEINC:71-72", "ATU_SRC/QSRVSRC/FCUSTOMER.BND:5"]
    behaviour_doc: features/cus-modules-c02.md
    dependencies: [CUSTOME1.LF, CUSTOMER.PF, SAMREF.PF]
    open_questions: ["needs-SME: no ATU_SRC program calls ExistCus — is the soft-delete rule enforced anywhere outside the tree, or is it dead API?"]
  - id: cus-modules-c03
    name: IsCusDeleted
    status: documented
    confidence: observed-in-code
    summary: "Returns CUDEL = 'X' after the cached chain; unknown id -> false (buffer cleared), so not-deleted and missing are indistinguishable from this call alone. No caller in ATU_SRC; no writer of CUDEL for customers in ATU_SRC either."
    entrypoints:
      - kind: api
        locator: FCUSTOMER IsCusDeleted
        evidence: ["ATU_SRC/QRPGLESRC/CUS300.RPGLE:163-171", "ATU_SRC/QPROTOSRC/CUSTOMER.RPGLEINC:76-77", "ATU_SRC/QSRVSRC/FCUSTOMER.BND:18"]
    behaviour_doc: features/cus-modules-c03.md
    dependencies: [CUSTOME1.LF, CUSTOMER.PF]
    open_questions: []
  - id: cus-modules-c04
    name: Lazy open and last-key cache in chainCUSTOME1
    status: documented
    confidence: observed-in-code
    summary: "Opens CUSTOME1 (USROPN, input-only) on first use, never closed by exported code; skips the CHAIN when the requested id equals the buffer CUID; otherwise clear *all FCUST then chain. Hits cached for the activation-group lifetime (stale after updates by other programs); misses return blanks/zeros and are not cached (buffer CUID = 0). Unmonitored open/chain."
    entrypoints:
      - kind: other
        locator: CUS300 chainCUSTOME1
        evidence: ["ATU_SRC/QRPGLESRC/CUS300.RPGLE:6", "ATU_SRC/QRPGLESRC/CUS300.RPGLE:10-16", "ATU_SRC/QRPGLESRC/CUS300.RPGLE:173-186", "ATU_SRC/QILESRVSRC/FCUSTOMER.ILESRVPGM:8"]
    behaviour_doc: features/cus-modules-c04.md
    dependencies: [CUSTOME1.LF, CUSTOMER.PF]
    open_questions:
      - "needs-SME: getters on a missing id return blank/zero silently — preserve as the target contract or surface not-found?"
      - "needs-SME: is any caller relying on (or hurt by) the stale-read behaviour of the last-key cache within one activation group?"
  - id: cus-modules-c05
    name: CloseCUSTOME1 prototyped but not exported
    status: documented
    confidence: observed-in-code
    summary: "closeCUSTOME1 has no export keyword on its P-spec and no symbol in FCUSTOMER.BND, yet CUSTOMER.RPGLEINC prototypes it; nothing calls it (dead code). CUSTOME1 stays open for the activation group. Closing would not reset the cache anyway (buffer CUID untouched). A caller compiled against the include would fail at bind time."
    entrypoints:
      - kind: api
        locator: FCUSTOMER (missing export CLOSECUSTOME1)
        evidence: ["ATU_SRC/QRPGLESRC/CUS300.RPGLE:188-195", "ATU_SRC/QPROTOSRC/CUSTOMER.RPGLEINC:82-84", "ATU_SRC/QSRVSRC/FCUSTOMER.BND:4-20"]
    behaviour_doc: features/cus-modules-c05.md
    dependencies: [FCUSTOMER.BND, FCUSTOMER.ILESRVPGM, CUSTOMER.RPGLEINC]
    open_questions: ["needs-SME: intentional (file lifetime = activation group) or oversight?"]
