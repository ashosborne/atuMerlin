    c04: { status: RESIDUAL_EXPLAINED, note: "the machine at 5000 bytes with 127-byte ORD700 lines accepts 35 calls (pos + 600 > 5000 from the 36th; the card's '≈ 35'), pos then stays at 4452 and every later call fails — silent, permanent; at 8192 bytes 60 lines (the card's '≈ 60'). The table keeps 60 of 60 — CR-L5 observed as the documented delta; nothing caps or rotates; TODO(log-programs-c04) present, no SME answer invented", evidence: [P12, P15, "samlog.test.ts c04"], contract_risk: [CR-L5] }
