schema:
  samlog_reuse: "the ORD pack's table exactly — id bigint from a sequence, logged_at timestamp NOT NULL DEFAULT LOCALTIMESTAMP, user_id varchar(10) NOT NULL DEFAULT '', msg text NOT NULL; PK the only index; no trigger on samlog (the ORD700 / ORD701 triggers are on detord / orders) (P16)"
  additive: "first 371 lines of modern/db/schema.sql (CUS + ORD + VAT + DAT + COU + PAR objects) byte-identical to the pre-convert tip fc39676; the LOG section (from line 374) is four COMMENT ON statements — on samlog and its user_id / logged_at / msg columns — citing the pack id, c03, c04, c09 and CR-L3; no CREATE, ALTER, DROP, INSERT (P16 + shell diff)"
  no_new_object: "no table, view, function, sequence, index or trigger is added by the LOG pack; the SAMLOG user space is the ORD `samlog` table (reuse per the pack mapping rule)"

