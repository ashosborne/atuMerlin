contract_gaps:
  - { id: G-L1, severity: low, kind: contract-observation, where: "modern/src/shared/samlog/index.ts createSamlog(db: Db) with Db = pg.Pool (modern/src/db/pool.ts)", gap: "the module documents that a caller inside an ORD transaction logs as the same user the trigger would (atu.user is transaction-local, set by order.repository.ts on its own client), and P05 shows that alignment holds at runtime when createSamlog is handed the transaction's PoolClient. The parameter type is pg.Pool, and pg.PoolClient is not assignable to it (TS2345: missing totalCount, idleCount, waitingCount, expiredCount and three more — checked with tsc --strict against @types/pg), so through the typed API the only reachable default actor is the database role; the vitest suite exercises the in-transaction actor with a hand-written INSERT, not through the module. No card behaviour is affected — c07's alignment is between two writers of one table, and both name the same user when given the same transaction. A one-line widening of the parameter type to a query-only interface (Pick<pg.Pool | pg.PoolClient, 'query'>) at the next pack version makes the documented path typable", evidence: [P05] }
  - { id: G-L2, severity: low, kind: behaviour-observation, where: "modern/src/shared/samlog/index.ts normaliseLogEntry, formatLegacyLine, addLogEntry user cut", gap: "the 500A entry, the 10A user and the 500 varying line buffer were single-byte EBCDIC on the box; the module counts UTF-16 code units — 600 x 'é' stores 500 characters (1 000 UTF-8 bytes), a 12-character umlaut user is cut to 10 characters, the rebuilt line is cut at 500 characters. For the ASCII charset every in-tree caller produces (ORD700's message, the fixture users) the two counts coincide exactly (P01, P02, P04, P06); no RPG caller can pass a multi-byte character into a 500A parameter. Recorded so the constants are not mistaken for byte counts", evidence: [P18] }

