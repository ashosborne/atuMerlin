contract_gaps:
  - { id: G-C1, severity: low, kind: contract-documentation, where: "modern/README.md COU section, CR-C4 'Why' column", gap: "the rationale states that 'digits before letters and upper before lower hold in both' byte order and the EBCDIC keyed order; in EBCDIC (CP037) lower-case letters sort before upper-case and digits sort after all letters, so neither holds — only 'blank first' and the order of upper-case-only codes agree. The delta itself (byte order, not EBCDIC) is correctly declared and tested; the sentence describing where it is invisible is wrong. Fixture codes are upper-case and names are capitalised, so the demo never shows the difference", evidence: [P25] }
  - { id: G-C2, severity: low, kind: contract-observation, where: "modern/src/shared/fcountry/index.ts sltCountryOpen", gap: "keycod is the 2A view of pcod (normaliseCountryCode) but dft is pcod verbatim: sltCountryOpen('FRA') positions at FR and returns 'FRA' on F3 / F12. On the box pcod is a 2A field passed by reference so the two cannot differ. No modern caller passes anything to sltCountryOpen yet (CUS keeps its datalist)", evidence: [P16] }
  - { id: G-C3, severity: low, kind: contract-documentation, where: "architecture/atu-merlin-cou/CONVERT_RECORD.md and modern/README.md COU 'Edit surface honoured' (both say the CUS surface is unchanged)", gap: "existCountry / getCountryName are consumed by the CUS pack and now normalise their argument (cut to 2, trailing blanks ignored, blank short-circuits with no read) where the pre-convert surface compared the raw value: 'FRA' / 'FR ' now hit FR. Every input CUS parseInput can pass (<= 2 chars, right-trimmed) answers identically (136 values, P24), so nothing CUS-reachable changed; the record should say the CUS-facing semantics were widened rather than 'unchanged'", evidence: [P24] }
  - { id: G-C4, severity: low, kind: behaviour-observation, where: "modern/src/shared/fcountry/index.ts sltCountry (OFFSET $3)", gap: "the next load resumes by OFFSET from the position, the legacy resumed from the saved look-ahead row's key (SAVCOD / SAVDES). If a row that sorts before the resume point is inserted between two loads, the module repeats the last row of the previous page (and would skip one after a delete); the legacy would not. COUNTRY has no writer in modern (COU200 deferred) and is reference data, so it is not reachable in the demo; a key-based cursor is a one-line change at the next pack version, not this station's edit", evidence: [P26] }

