    - "card COMPARE: every converted / as-is card has an export or route, a test and a probe case; the residual pieces (c03 / c06 subfile mechanics, c07 WRKLNK panel, c09 hit cache, c10 binder metadata, c13 LOG anchor) carry a reason that traces to the pack (REPORT.md §4)"
    - "planted / known-risk behaviours preserved, not fixed: blank / missing PATH silent (P06), trailing slash verbatim (P07, P08), blank/blank row creatable and unreachable by the getters (P03, P21), unconditional unvalidated update (P16), immediate unconfirmed delete of PATH with no in-use check (P17), GetPARM1/3/4/5 exported with no consumer (P08), PATH-as-configuration not decided (table mapping + getPath seam, P08 / P22)"
