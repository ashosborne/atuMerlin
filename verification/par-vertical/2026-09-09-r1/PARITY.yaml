contract_gaps:
  - { id: G-P1, severity: low, kind: contract-documentation, where: "modern/README.md PAR section, CR-P3 'Why' column", gap: "the rationale states that 'digits before upper before lower hold in both' byte order and the EBCDIC keyed order; in EBCDIC (CP037) lower-case letters sort before upper-case and digits sort after every letter, so neither holds — only 'blank first', 'shorter key first' and the relative order of upper-case-only keys agree (P13: byte order '' 1A 9Z A AA AZ BE PATH ZZ a aa az path zz; EBCDIC '' a aa az path zz A AA AZ BE PATH ZZ 1A 9Z). The delta itself (byte order, not EBCDIC) is correctly declared and tested; the sentence describing where it is invisible is wrong. Same wording as G-C1 in the COU section; in-tree keys are upper-case so the demo never shows the difference", evidence: [P13] }
  - { id: G-P2, severity: low, kind: behaviour-observation, where: "modern/src/features/par/par.service.ts readChar / asRecord", gap: "three input corners a 5250 field could not produce: (a) the width check runs before the right-trim, so 'A' + ten blanks (11 characters, would store as 'A') is refused FIELD_TOO_LONG rather than trimmed; (b) JavaScript toUpperCase can lengthen a string ('ß' -> 'SS'), so ten 'ß' pass the 10-character check, fold to 20 characters and fail in the column with 500 INTERNAL instead of a 400; (c) a JSON array body is read as an empty form and creates the blank/blank row (201). None is reachable from a 5250 field (single-byte EBCDIC, fixed width) and none changes an answer on the card's domain", evidence: [P15] }
  - { id: G-P3, severity: low, kind: behaviour-observation, where: "modern/src/features/par/par.routes.ts parameterKeyOf on the keyed routes", gap: "the URL key is folded to upper case like the display, so a row whose key is lower-case — possible only when written by another tool (c02 edge, c12 edge) — is listed by GET /api/parameters and invisible to the getters (as on the box) but cannot be opened, updated or deleted through the keyed routes: GET / PUT answer 404 for the folded key and DELETE is a silent 204 that removes nothing (P19). PAR200 took the key for option 2 / 4 from the subfile row itself and could edit or delete such a row. The API is the only writer in modern and folds on create, so the case needs an out-of-band write; a non-folding keyed route (or folding only on POST) is a one-line choice at the next pack version", evidence: [P19] }
  - { id: G-P4, severity: low, kind: card-nuance, where: "discovery/par-maintain/features/par-maintain-c09.md summary vs step 4; modern/src/shared/parm/index.ts chain", gap: "the card's summary says a blank key 'never reads'; its step 4 says the blank request equals the *cleared* key. Replaying the buffer machine shows the two differ after a hit: from a cleared buffer a blank/blank request does not read (0 reads, matches the module), but after GetParm2('PATH':' ') the buffer key is PATH, a following blank/blank request differs, chains, and would return the blank/blank row's values ('HIDDEN' in P05); the module short-circuits unconditionally and returns blanks with no read. No caller in the estate passes a blank key (c11), so the case is unreachable; recorded so the module's rule is not mistaken for the exact legacy state machine", evidence: [P05] }

