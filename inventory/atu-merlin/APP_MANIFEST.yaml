    by value; net 9P 2, result 9P 2. Equivalent to half-adjusting the exact quotient to 2 dp. No overflow path (|tot| < 10^7). Callers add it to the net (ODTOTVAT = ODTOT + vat); DETORD stores ODTOT/ODTOTVAT
