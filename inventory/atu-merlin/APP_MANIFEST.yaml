  notes: 'confidence: inferred; pos lives in the shared object; AddLogEntry does read pos (27) / write 600 bytes at pos (31) / pos += len (32, re-reads the shared pos) with no ALCOBJ, LOCK, CMPSWP or data-area
    indirection; a user space has no implicit lock. Two jobs deleting lines at the same instant (ORD700 runs in the deleting job) both read pos = P and both write at P: the second write overwrites the first
    line entirely (600-byte pad); the += increments are relative so the cursor over-advances by the lost line''s length, leaving a blank run. Lost lines leave no trace. Cursor corruption possible if two
    load/add/store sequences interleave (narrower window). Window microseconds, in-tree rate a few deletes a day; realistic for a two-job cleanup. Disappears once the space is full (c04). Recorded as-is;
    target insert is transactional.'
