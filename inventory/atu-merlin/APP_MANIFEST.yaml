notes: 'estate_scan: partial (see overnight/METHOD_COVERAGE.md). Pack A radar output: candidates only, nothing bound. Surfaces are callable IBM i objects (PGM/MODULE/SRVPGM/CL/CMD/trigger); DSPF/PRTF are
  evidence on the owning program. kind=other for all IBM i surfaces (schema enum is integration-flavoured). Human residual gate required. | Room bind 2026-09-08: accepted cus-interactive, cus-modules (fold
  srvpgm-fcustomer), ord-entry-ord100, ord-trigger-ord700; deferred ord-batch-ord900; skip art-* until ART302 answered. Pack B document only; inferred stay needs-SME; convert later CUS-only. | Pack B run
  1 (2026-09-08): cus-interactive 12/12 accepted behaviours documented (cards under discovery/cus-interactive/features/); bind statuses (accepted/deferred) mirrored from slice MANIFESTs for cus-modules,
  ord-entry-ord100, ord-trigger-ord700, ord-batch-ord900. CHARACTERIZATION: deferred-waived. No conversion, no tests. | Pack B run 2 (2026-09-08): cus-modules 10/10 accepted behaviours documented (cards
  under discovery/cus-modules/features/); c10 stays needs-SME (inferred), no card. | Pack B run 3 (2026-09-08): ord-entry-ord100 12/12 accepted behaviours documented (cards under discovery/ord-entry-ord100/features/);
  c09, c11 stay needs-SME (inferred), no card. | Pack B run 4 (2026-09-08): ord-trigger-ord700 8/8 accepted behaviours documented (cards discovery/ord-trigger-ord700/features/); c01, c08, c11 stay needs-SME.
  Bind queue now empty; conveyor idle until more slices are bound. CHARACTERIZATION: deferred-waived. No conversion, no tests. | Pack B run 6 (2026-09-08): dat-utils 8/8 accepted behaviours documented (cards
  discovery/dat-utils/features/); no needs-SME candidates; surfaces udf:ISOTODATE40 / udf:ISO_Num_To_Date candidate -> accepted (bind mirror). Remaining queue: cou-maintain FCOUNTRY c07-c12. CHARACTERIZATION:
  deferred-waived. No conversion, no tests. | Pack B run 7 (2026-09-08): cou-maintain FCOUNTRY half c07-c12 6/6 accepted behaviours documented (cards discovery/cou-maintain/features/); c01-c06, c13 deferred
  (bind mirror); surfaces srvpgm:FCOUNTRY / mod:COU300 / mod:COU301 candidate -> accepted, pgm:COU200 -> deferred. Residual-wave queue empty; conveyor idle until the next ORD bind wave. CHARACTERIZATION:
  deferred-waived. No conversion, no tests. | Pack B run 8 (2026-09-08): ord-entry-ord101 documented (11 cards; c11 needs-SME); ORD wave queue left: ord-maintain-ord200, ord-maintain-ord201, ord-maintain-ord202,
  ord-print-ord500 | Pack B run 9 (2026-09-08): ord-maintain-ord200 documented (12 cards; c12 needs-SME); ORD wave queue left: ord-maintain-ord201, ord-maintain-ord202, ord-print-ord500 | Pack B run 10
  (2026-09-08): ord-maintain-ord201 documented (11/11 accepted cards; no needs-SME candidates); CHARACTERIZATION deferred-waived; ORD-wave queue left: ord-maintain-ord202, ord-print-ord500 | Pack B run
  11 (2026-09-08): ord-maintain-ord202 documented (6/6 accepted cards; no needs-SME candidates); CHARACTERIZATION deferred-waived; ORD-wave queue left: ord-print-ord500 | Pack B run 12 (2026-09-08): ord-print-ord500
  documented (7/7 accepted cards; c04 needs-SME inferred, no card); CHARACTERIZATION deferred-waived; ORD-wave queue EMPTY - all five ORD slices carded; next: ME drafts the new ORD Architecture pack (ROOM_OK
  then) | Pack B run 13 (2026-09-09): par-maintain 13/13 accepted behaviours documented (cards discovery/par-maintain/features/); c08 inferred carded (bind accepted it); surfaces pgm:PAR200 / cl:PAR201
  / srvpgm:FPARAMETER / mod:PAR300 candidate -> accepted. Night residual-wave queue left: log-programs, menu-cmd-shell, srvpgm-supporting, sql-objects, ord-batch-ord900, cou-maintain COU200 half, pro-interactive,
  pro-modules, pro-cobol-pro201. CHARACTERIZATION: deferred-waived. No conversion, no tests. | Pack B run 14 (2026-09-09): log-programs 10/10 accepted behaviours documented (cards discovery/log-programs/features/);
  c04, c06, c09, c10 inferred carded (bind accepted them); surfaces pgm:LOG100 / srvpgm:LOG / mod:LOG300 candidate -> accepted. Night residual-wave queue left: menu-cmd-shell, srvpgm-supporting, sql-objects,
  ord-batch-ord900, cou-maintain COU200 half, pro-interactive, pro-modules, pro-cobol-pro201. CHARACTERIZATION: deferred-waived. No conversion, no tests. | Pack B run 15 (2026-09-09): menu-cmd-shell 9/9
  accepted behaviours documented (cards discovery/menu-cmd-shell/features/); c02 inferred carded (bind accepted it); surfaces menu:SAMMNU / pnlgrp:SAMHELP / msgf:SAMMSGF / cmd:CVTSPLPDF candidate -> accepted.
  Phase A corrected: ERR0001 is live (ART200D.DSPF:98) - dead messages are ERR0003/0004/0005 (three). Night residual-wave queue left: srvpgm-supporting, sql-objects, ord-batch-ord900, cou-maintain COU200
  half, pro-interactive, pro-modules, pro-cobol-pro201. CHARACTERIZATION: deferred-waived. No conversion, no tests. | Pack B run 16 (2026-09-09): srvpgm-supporting 9/9 accepted behaviours documented (cards
  discovery/srvpgm-supporting/features/); c05 inferred carded (bind accepted it); surface bnddir:SAMPLE candidate -> accepted; srvpgm:XML / XSS / ORDER / TXT stay unknown (absence recorded in c02). Phase
  A c07 corrected: default activation group is QILE (job-wide caches), not new-per-program - runtime-confirm. par-maintain-c10 corrected via srvpgm-supporting-c06: EXPORT(*ALL) exports 5 (not 7). CHARACTERIZATION
  deferred-waived. Night residual queue left: sql-objects, ord-batch-ord900, cou-maintain COU200 half, pro-interactive, pro-modules, pro-cobol-pro201. | Pack B run 17 (2026-09-09): sql-objects 10/10 accepted
  behaviours documented (cards discovery/sql-objects/features/); c04 inferred carded (bind accepted it); surfaces view:ORDERCUS / view:ARTLSTDAT / table:ARTIINF / seq:CUSSEQ / sqlprc:ART801 candidate ->
  accepted. c07 / c08 are object-surface cards pointing at cus-interactive-c02 / ord-trigger-ord700-c10 (CUS/ORD not widened). CHARACTERIZATION deferred-waived. No conversion, no tests. Night residual queue
  left: ord-batch-ord900, cou-maintain COU200 half, pro-interactive, pro-modules, pro-cobol-pro201. | Pack B run 18 (2026-09-09): ord-batch-ord900 9/9 accepted behaviours documented (cards discovery/ord-batch-ord900/features/;
  c07 inferred carded, confidence kept); pgm:ORD900 / pgm:ORD901 deferred -> accepted per night residual bind. Sharpened: ORD900 empty file writes LASTORDNO = 0; ORD901 guard works via -305 path; one offset,
  sign from data, double shift on rerun after partial run; 10-day auto-close rule only here, closed-without-delivery reachable; ORD901 is the only writer of DETORD.ODYEAR; CULASTORD statement verbatim ART801:35-37;
  ARCUSQTY/CUCREDIT left stale after closes; no SET OPTION COMMIT (build option not in tree); no scheduling/parameters; lastdate reuse trap. Recommendation unchanged: defer from conversion scope if c07
  confirmed. CHARACTERIZATION: deferred-waived. No conversion, no tests. Night residual queue left: cou-maintain COU200 half; pro-interactive, pro-modules, pro-cobol-pro201 room-held.'
