    %date(dat8:*iso) or date_ind = -1 (NULL, date untouched). NULL in never reaches the program (RETURNS NULL ON NULL INPUT). No range check; years 0001-9999 accepted. Derived: 1940-01-01 / 2039-12-31 are
    *LOVAL / *HIVAL of RPG 2-digit-year date formats. In-tree writers produce only 0 or a valid date, so the 2039 branch is unreachable from in-tree data and has no MAPVAL (would display and count as ''closed'').
    Callers fetch the result with no null indicator, so a NULL (invalid stored date) ends the ORD200/ORD201 list load silently (SQLCODE -305) - pointer to the caller slices, reachable only via out-of-tree
    writes.'
